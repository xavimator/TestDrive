<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Boceto 3D — de trazo a sólido</title>
<style>
  :root{
    --bg: #0b1020;
    --panel: #11172b;
    --line: #24304d;
    --ink: #dbe4ff;
    --dim: #7c89ad;
    --amber: #f0a339;   /* triángulo -> prisma */
    --cyan: #3fc7e0;    /* círculo -> esfera */
    --mint: #4fd6a4;    /* línea -> cilindro */
    --accent: #7c8cff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:'Courier New',ui-monospace,monospace;color:var(--ink);}
  #stage{position:fixed;inset:0;}
  #scene{position:absolute;inset:0;pointer-events:none;}
  #overlay{position:absolute;inset:0;touch-action:none;cursor:crosshair;}
  #overlay.mode-select{cursor:default;}

  /* ---- Top bar: drafting-table control strip ---- */
  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; z-index:10; pointer-events:none;
  }
  .brand{
    pointer-events:auto;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--dim);
  }
  .brand b{color:var(--ink); letter-spacing:.02em;}
  .brand .rule{display:inline-block;width:22px;height:1px;background:var(--line);margin:0 8px;vertical-align:middle;}

  #toolbar{
    pointer-events:auto;
    display:flex; gap:10px; align-items:center;
    background:rgba(17,23,43,.9); border:1px solid var(--line);
    border-radius:10px; padding:6px; backdrop-filter: blur(6px);
  }
  .grp{display:flex; gap:2px; padding:0 6px; border-right:1px solid var(--line);}
  .grp:last-child{border-right:none;}
  button{
    font-family:inherit; font-size:12px; letter-spacing:.04em;
    background:transparent; color:var(--dim); border:1px solid transparent;
    border-radius:7px; padding:8px 12px; cursor:pointer; transition:.15s;
  }
  button:hover{color:var(--ink); background:rgba(124,140,255,.08);}
  button.active{color:#0b1020; background:var(--accent); font-weight:700;}
  button.danger:hover{color:#ff8080; background:rgba(255,90,90,.1);}
  button:disabled{opacity:.35; cursor:not-allowed;}
  button:disabled:hover{background:transparent; color:var(--dim);}

  button.icon{
    width:34px; height:34px; padding:0;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .top-only{display:none;}
  #toolbar.mode-top .top-only{display:flex;}
  .sketch-only{display:none;}
  #toolbar.mode-sketch .sketch-only{display:flex;}
  button.cta{
    background:var(--mint); color:#04241a; font-weight:700; padding:8px 14px; font-size:12.5px;
  }
  button.cta:hover{background:#65e0b6; color:#04241a;}

  /* ---- Legend, bottom-left ---- */
  #legend{
    position:absolute; left:18px; bottom:16px; z-index:10;
    font-size:11px; color:var(--dim); line-height:1.9;
    background:rgba(17,23,43,.72); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px;
  }
  #legend .row{display:flex; align-items:center; gap:8px;}
  #legend .sw{width:10px;height:10px;border-radius:2px;flex:none;}
  #legend .hint{margin-top:8px; color:#54608a; font-size:10.5px;}

  /* ---- Toast ---- */
  #toast{
    position:absolute; top:76px; left:50%; transform:translate(-50%,-8px);
    background:rgba(17,23,43,.95); border:1px solid var(--line);
    color:var(--ink); font-size:12px; padding:8px 14px; border-radius:8px;
    opacity:0; transition:opacity .25s, transform .25s; z-index:20; pointer-events:none;
    white-space:nowrap;
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}

  /* ---- Mode badge, bottom-right ---- */
  #modebadge{
    position:absolute; right:18px; bottom:16px; z-index:10;
    font-size:11px; color:var(--dim);
    background:rgba(17,23,43,.72); border:1px solid var(--line);
    border-radius:10px; padding:10px 14px; text-align:right;
  }
  #modebadge b{color:var(--ink);}
</style>
</head>
<body>

<div id="stage">
  <canvas id="scene"></canvas>
  <canvas id="overlay"></canvas>

  <div id="hud">
    <div class="brand"><b>BOCETO 3D</b><span class="rule"></span>trazo &rarr; sólido</div>

    <div id="toolbar">
      <div class="grp">
        <button id="btn-draw" class="active">✏ Dibujar</button>
        <button id="btn-select">☝ Seleccionar</button>
        <button id="btn-top">▦ Vista superior</button>
      </div>
      <div class="grp">
        <button id="btn-move" class="icon" disabled title="Mover">⇔</button>
        <button id="btn-rotate" class="icon" disabled title="Rotar">⟳</button>
        <button id="btn-scale" class="icon" disabled title="Escalar">⤢</button>
      </div>
      <div class="grp top-only">
        <button id="btn-symmetry" class="icon" title="Simetría: izquierda-derecha">⟷</button>
      </div>
      <div class="grp sketch-only">
        <button id="btn-clear-sketch" class="icon danger" title="Borrar boceto">⌫</button>
        <button id="btn-convert" class="cta" title="Convertir el boceto en objetos 3D">⇪ Convertir a 3D</button>
      </div>
      <div class="grp">
        <button id="btn-import-image" class="icon" title="Importar dibujo (imagen)">🖼</button>
        <button id="btn-import-model" class="icon" title="Importar modelo (.obj / .stl)">📦</button>
      </div>
      <div class="grp">
        <button id="btn-delete" class="icon danger" disabled title="Eliminar seleccionado">🗑</button>
        <button id="btn-clear" class="icon danger" title="Borrar todo">✕</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-image" accept="image/*" style="display:none">
  <input type="file" id="file-model" accept=".obj,.stl" style="display:none">

  <div id="legend">
    <div class="row"><span class="sw" style="background:var(--amber)"></span> Triángulo → prisma</div>
    <div class="row"><span class="sw" style="background:var(--cyan)"></span> Círculo → esfera</div>
    <div class="row"><span class="sw" style="background:var(--mint)"></span> Línea → cilindro fino</div>
    <div class="row"><span class="sw" style="background:#d8a6ff"></span> Imagen / modelo importado</div>
    <div class="hint">Los trazos se guardan — nada se crea hasta pulsar “Convertir a 3D”<br>Clic derecho + arrastrar: orbitar (no en vista superior) · rueda: zoom</div>
  </div>

  <div id="modebadge">Modo: <b id="modelabel">Dibujar</b><br>Objetos: <b id="objcount">0</b></div>

  <div id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<script>
(function(){
  "use strict";
  try {

  /* ============ THREE.JS SCENE SETUP ============ */
  const sceneCanvas = document.getElementById('scene');
  const overlay = document.getElementById('overlay');
  const octx = overlay.getContext('2d');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1020);
  scene.fog = new THREE.Fog(0x0b1020, 18, 42);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 200);
  const TOP_HALF = 15;
  const camTop = new THREE.OrthographicCamera(-TOP_HALF, TOP_HALF, TOP_HALF, -TOP_HALF, 0.1, 100);
  camTop.position.set(0, 30, 0);
  camTop.up.set(0, 0, -1);
  camTop.lookAt(0, 0, 0);
  let activeCam = camera; // swapped to camTop while in top-view mode

  /* ============ STATE ============ */
  let mode = 'draw';            // 'draw' | 'select' | 'top'
  let transformMode = 'move';   // 'move' | 'rotate' | 'scale'
  const objects = [];           // {mesh, type}
  let selected = null;

  let symmetryMode = 'h';       // 'none' | 'h' | 'v' | 'both'
  let topCurrent = null;        // {points:[...]} stroke being drawn (draw or top mode)
  let topStrokes = [];          // accumulated {points, color} until conversion

  let orbiting = false, lastX=0, lastY=0;
  let dragging = false, dragStart = {x:0,y:0};
  let initialScale = null, initialRotY = 0;

  const raycaster = new THREE.Raycaster();
  const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);

  const renderer = new THREE.WebGLRenderer({canvas: sceneCanvas, antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const ambient = new THREE.AmbientLight(0x3b4a7a, 0.9);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xfff2da, 1.15);
  sun.position.set(8, 14, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
  sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x5566ff, 0.25);
  rim.position.set(-10,4,-8);
  scene.add(rim);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(60,60),
    new THREE.MeshStandardMaterial({color:0x121a33, roughness:1, metalness:0})
  );
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  const grid = new THREE.GridHelper(60, 60, 0x2a3660, 0x1a2340);
  grid.position.y = 0.001;
  scene.add(grid);

  /* ---- Orbit camera (custom, no addons) ---- */
  const target = new THREE.Vector3(0,1,0);
  let radius = 13, theta = Math.PI*0.28, phi = Math.PI*0.32;
  function updateCamera(){
    phi = Math.max(0.12, Math.min(Math.PI-0.12, phi));
    radius = Math.max(4, Math.min(30, radius));
    camera.position.set(
      target.x + radius*Math.sin(phi)*Math.sin(theta),
      target.y + radius*Math.cos(phi),
      target.z + radius*Math.sin(phi)*Math.cos(theta)
    );
    camera.lookAt(target);
  }
  updateCamera();

  function updateTopCamFrustum(){
    const aspect = window.innerWidth/window.innerHeight;
    camTop.left = -TOP_HALF*aspect;
    camTop.right = TOP_HALF*aspect;
    camTop.top = TOP_HALF;
    camTop.bottom = -TOP_HALF;
    camTop.updateProjectionMatrix();
  }

  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w/h; camera.updateProjectionMatrix();
    updateTopCamFrustum();
    renderer.setSize(w,h);
    overlay.width = w; overlay.height = h;
    if (mode === 'top') redrawTopCanvas();
  }
  window.addEventListener('resize', resize);
  resize();

  (function loop(){ renderer.render(scene, activeCam); requestAnimationFrame(loop); })();

  /* ============ HELPERS ============ */
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(()=>t.classList.remove('show'), 1600);
  }

  function ndc(clientX, clientY){
    return new THREE.Vector2(
      (clientX/window.innerWidth)*2 - 1,
      -(clientY/window.innerHeight)*2 + 1
    );
  }

  function screenToGround(clientX, clientY){
    const m = ndc(clientX, clientY);
    raycaster.setFromCamera(m, activeCam);
    const pt = new THREE.Vector3();
    const hit = raycaster.ray.intersectPlane(groundPlane, pt);
    return hit ? pt : null;
  }

  function pickObject(clientX, clientY){
    const m = ndc(clientX, clientY);
    raycaster.setFromCamera(m, activeCam);
    const meshes = objects.map(o=>o.mesh);
    const hits = raycaster.intersectObjects(meshes, false);
    if (!hits.length) return null;
    return objects.find(o=>o.mesh === hits[0].object) || null;
  }

  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  /* ============ TOP-VIEW SYMMETRY HELPERS ============ */
  function mirrorPoint(p, kind){
    const W = overlay.width, H = overlay.height;
    if (kind === 'h') return {x: W-p.x, y: p.y};
    if (kind === 'v') return {x: p.x, y: H-p.y};
    return {x: W-p.x, y: H-p.y}; // 'both'
  }
  function getMirrorKinds(){
    if (symmetryMode === 'h') return ['h'];
    if (symmetryMode === 'v') return ['v'];
    if (symmetryMode === 'both') return ['h','v','both'];
    return [];
  }
  function drawSeg(a, b, color){
    octx.strokeStyle = color; octx.lineWidth = 3; octx.lineCap='round'; octx.lineJoin='round';
    octx.beginPath(); octx.moveTo(a.x,a.y); octx.lineTo(b.x,b.y); octx.stroke();
  }
  function drawStrokePath(points, color){
    if (points.length < 2) return;
    octx.strokeStyle = color; octx.lineWidth = 3; octx.lineCap='round'; octx.lineJoin='round';
    octx.beginPath();
    octx.moveTo(points[0].x, points[0].y);
    for (let i=1;i<points.length;i++) octx.lineTo(points[i].x, points[i].y);
    octx.stroke();
  }
  function drawTopGuides(){
    if (mode !== 'top') return;
    const W = overlay.width, H = overlay.height;
    octx.save();
    octx.setLineDash([6,6]);
    octx.strokeStyle = 'rgba(124,140,255,0.35)';
    octx.lineWidth = 1;
    if (symmetryMode === 'h' || symmetryMode === 'both'){
      octx.beginPath(); octx.moveTo(W/2,0); octx.lineTo(W/2,H); octx.stroke();
    }
    if (symmetryMode === 'v' || symmetryMode === 'both'){
      octx.beginPath(); octx.moveTo(0,H/2); octx.lineTo(W,H/2); octx.stroke();
    }
    octx.restore();
  }
  function redrawTopCanvas(){
    octx.clearRect(0,0,overlay.width, overlay.height);
    drawTopGuides();
    for (const s of topStrokes) drawStrokePath(s.points, s.color);
  }
  function enterSketchMode(m){
    activeCam = (m === 'top') ? camTop : camera;
    redrawTopCanvas();
  }
  function exitSketchMode(){
    if (topStrokes.length) toast('Boceto descartado (sin convertir)');
    topStrokes = [];
    topCurrent = null;
    octx.clearRect(0,0,overlay.width, overlay.height);
  }

  /* ============ SHAPE CLASSIFICATION ============ */
  function pathLength(pts){
    let L=0; for(let i=1;i<pts.length;i++) L += dist(pts[i-1],pts[i]);
    return L;
  }
  function bbox(pts){
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for(const p of pts){ if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; }
    return {minX,maxX,minY,maxY,w:maxX-minX,h:maxY-minY};
  }
  function shoelaceArea(pts){
    let a=0;
    for(let i=0;i<pts.length;i++){
      const p1=pts[i], p2=pts[(i+1)%pts.length];
      a += p1.x*p2.y - p2.x*p1.y;
    }
    return Math.abs(a)/2;
  }
  function perpDist(p,a,b){
    const num = Math.abs((p.x-a.x)*(b.y-a.y) - (p.y-a.y)*(b.x-a.x));
    const den = dist(a,b) || 1;
    return num/den;
  }
  function douglasPeucker(pts, epsilon){
    if (pts.length < 3) return pts.slice();
    const a = pts[0], b = pts[pts.length-1];
    let maxD=-1, idx=-1;
    for(let i=1;i<pts.length-1;i++){
      const d = perpDist(pts[i], a, b);
      if (d>maxD){ maxD=d; idx=i; }
    }
    if (maxD > epsilon){
      const left = douglasPeucker(pts.slice(0, idx+1), epsilon);
      const right = douglasPeucker(pts.slice(idx), epsilon);
      return left.slice(0,-1).concat(right);
    }
    return [a,b];
  }

  function classify(pts){
    if (pts.length < 4) return null;
    const box = bbox(pts);
    const diag = Math.hypot(box.w, box.h);
    if (diag < 14) return null;

    const start = pts[0], end = pts[pts.length-1];
    const closeGap = dist(start,end);
    const perim = pathLength(pts);
    const closed = closeGap < Math.max(diag*0.30, 20);

    if (!closed){
      const lineLen = dist(start,end);
      let maxDev = 0;
      for (const p of pts) maxDev = Math.max(maxDev, perpDist(p,start,end));
      if (lineLen > 26 && maxDev < Math.max(lineLen*0.18, 9)){
        return {type:'line', box, start, end, points: pts};
      }
      return null; // open, wobbly -> unrecognized
    }

    // closed shape: circle vs triangle
    const area = shoelaceArea(pts);
    const circularity = perim > 0 ? (4*Math.PI*area)/(perim*perim) : 0;
    if (circularity > 0.72) return {type:'circle', box, points: pts};

    const simplified = douglasPeucker(pts, Math.max(diag*0.07, 6));
    let verts = simplified.length;
    // closed path's simplified list repeats start≈end, so real corner count is verts-1
    let corners = verts - 1;
    if (corners === 3) return {type:'triangle', box, points: pts};
    if (circularity > 0.55) return {type:'circle', box, points: pts};
    return {type:'triangle', box, points: pts}; // sensible default for any other closed blob
  }

  /* ============ SPAWNING SHAPES ============ */
  const SCALE = 0.016; // pixels -> world units

  function restY(o){
    const u = o.mesh.userData;
    const s = o.mesh.scale.y;
    if (o.type==='circle') return u.baseRadius*s;
    if (o.type==='triangle') return (u.baseHeight*s)/2;
    if (o.type==='line') return u.baseRadius*s;
    return o.mesh.position.y; // imported/custom meshes: geometry already rests at y=0 locally
  }

  function spawn(shape){
    const box = shape.box;
    const cx = (box.minX+box.maxX)/2, cy = (box.minY+box.maxY)/2;
    const posGround = screenToGround(cx, cy);
    if (!posGround){ toast('No pude ubicar el punto en el suelo, intenta de nuevo'); return; }

    let mesh, color, baseRadius=0.5, baseHeight=1;

    if (shape.type === 'triangle'){
      color = 0xf0a339;
      baseRadius = Math.max(((box.w+box.h)/4)*SCALE, 0.45);
      baseHeight = Math.max(box.h*SCALE*1.3, 0.9);
      const geo = new THREE.CylinderGeometry(baseRadius, baseRadius, baseHeight, 3);
      mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:.45, metalness:.15}));
      const bx = (box.minX+box.maxX)/2, by = (box.minY+box.maxY)/2;
      const first = (shape.points && shape.points[0]) || {x:bx+1, y:by};
      mesh.rotation.y = -Math.atan2(first.y-by, first.x-bx);
      mesh.position.set(posGround.x, baseHeight/2, posGround.z);
    } else if (shape.type === 'circle'){
      color = 0x3fc7e0;
      baseRadius = Math.max(((box.w+box.h)/4)*SCALE, 0.4);
      const geo = new THREE.SphereGeometry(baseRadius, 28, 20);
      mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:.35, metalness:.15}));
      mesh.position.set(posGround.x, baseRadius, posGround.z);
    } else { // line
      color = 0x4fd6a4;
      baseRadius = 0.09;
      const length = Math.max(dist(shape.start, shape.end)*SCALE, 1.1);
      baseHeight = length;
      const geo = new THREE.CylinderGeometry(baseRadius, baseRadius, length, 14);
      mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:.4, metalness:.2}));
      const ang = Math.atan2(shape.end.y - shape.start.y, shape.end.x - shape.start.x);
      mesh.rotation.z = Math.PI/2;   // lay cylinder flat, now runs along world X
      mesh.rotateY(-ang);            // point it along the drawn direction
      const startG = screenToGround(shape.start.x, shape.start.y);
      const endG = screenToGround(shape.end.x, shape.end.y);
      const mid = startG && endG ? startG.clone().add(endG).multiplyScalar(0.5) : posGround;
      mesh.position.set(mid.x, baseRadius, mid.z);
    }

    mesh.castShadow = true;
    mesh.userData = {baseRadius, baseHeight, baseColor: color};
    scene.add(mesh);
    const obj = {mesh, type: shape.type};
    objects.push(obj);
    updateCount();
    return obj;
  }

  function updateCount(){
    document.getElementById('objcount').textContent = objects.length;
  }

  /* ============ IMPORT: DRAWING/IMAGE -> FIGURE ============ */
  function convexHull(points){
    const pts = points.slice().sort((a,b)=> a.x-b.x || a.y-b.y);
    const cross = (o,a,b) => (a.x-o.x)*(b.y-o.y) - (a.y-o.y)*(b.x-o.x);
    const lower = [];
    for (const p of pts){
      while (lower.length>=2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
      lower.push(p);
    }
    const upper = [];
    for (let i=pts.length-1;i>=0;i--){
      const p = pts[i];
      while (upper.length>=2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
      upper.push(p);
    }
    upper.pop(); lower.pop();
    return lower.concat(upper);
  }

  function extractMask(imgData, w, h){
    const d = imgData.data;
    const mask = new Uint8Array(w*h);
    let hasAlpha = false;
    for (let i=3;i<d.length;i+=4){ if (d[i] < 250){ hasAlpha=true; break; } }
    for (let i=0, p=0; i<d.length; i+=4, p++){
      if (hasAlpha){
        mask[p] = d[i+3] > 40 ? 1 : 0;
      } else {
        const lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        mask[p] = lum < 200 ? 1 : 0;
      }
    }
    return mask;
  }

  function spawnImportedFigure(hullPx){
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for (const p of hullPx){ if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; }
    const w = maxX-minX, h = maxY-minY;
    const target = 2.6;
    const s = target / Math.max(w,h,1);
    const cx = (minX+maxX)/2, cy=(minY+maxY)/2;

    const shapeGeom = new THREE.Shape();
    hullPx.forEach((p,i)=>{
      const sx=(p.x-cx)*s, sy=-(p.y-cy)*s;
      if (i===0) shapeGeom.moveTo(sx,sy); else shapeGeom.lineTo(sx,sy);
    });
    shapeGeom.closePath();

    const geo = new THREE.ExtrudeGeometry(shapeGeom, {depth:0.5, bevelEnabled:false, steps:1});
    geo.computeBoundingBox();
    const bb = geo.boundingBox;
    geo.translate(-(bb.min.x+bb.max.x)/2, -bb.min.y, -(bb.min.z+bb.max.z)/2);
    geo.computeVertexNormals();

    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0xd8a6ff, roughness:.5, metalness:.1}));
    mesh.castShadow = true;
    mesh.userData = {custom:true};
    const spawnPos = screenToGround(window.innerWidth/2, window.innerHeight/2) || new THREE.Vector3(0,0,0);
    mesh.position.set(spawnPos.x, 0, spawnPos.z);

    scene.add(mesh);
    const obj = {mesh, type:'imported'};
    objects.push(obj);
    updateCount();
    setMode('select');
    select(obj);
    toast('Figura importada creada');
  }

  function importImageFile(file){
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const maxDim = 260;
      const scaleDown = Math.min(1, maxDim / Math.max(img.width, img.height));
      const cw = Math.max(1, Math.round(img.width*scaleDown));
      const ch = Math.max(1, Math.round(img.height*scaleDown));
      const c = document.createElement('canvas');
      c.width = cw; c.height = ch;
      const cctx = c.getContext('2d');
      cctx.drawImage(img, 0, 0, cw, ch);
      URL.revokeObjectURL(url);
      let imgData;
      try { imgData = cctx.getImageData(0,0,cw,ch); }
      catch(e){ toast('No se pudo leer la imagen'); return; }
      const mask = extractMask(imgData, cw, ch);
      const isFg = (x,y)=> x>=0&&y>=0&&x<cw&&y<ch && mask[y*cw+x]===1;
      const edgePts = [];
      for (let y=0;y<ch;y++){
        for (let x=0;x<cw;x++){
          if (!isFg(x,y)) continue;
          if (!isFg(x-1,y)||!isFg(x+1,y)||!isFg(x,y-1)||!isFg(x,y+1)) edgePts.push({x,y});
        }
      }
      if (edgePts.length < 8){ toast('No se detectó un dibujo claro en la imagen'); return; }
      const hull = convexHull(edgePts);
      if (hull.length < 3){ toast('No se pudo extraer un contorno de la imagen'); return; }
      spawnImportedFigure(hull);
    };
    img.onerror = () => toast('No se pudo cargar la imagen');
    img.src = url;
  }

  /* ============ IMPORT: OBJ / STL MODELS ============ */
  function parseOBJ(text){
    const verts = [];
    const positions = [];
    const lines = text.split('\n');
    for (const raw of lines){
      const line = raw.trim();
      if (!line || line[0]==='#') continue;
      const parts = line.split(/\s+/);
      const tag = parts[0];
      if (tag === 'v'){
        verts.push([parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])]);
      } else if (tag === 'f'){
        const idxs = parts.slice(1).map(tok=>{
          const rawIdx = tok.split('/')[0];
          let idx = parseInt(rawIdx, 10);
          if (idx < 0) idx = verts.length + idx + 1;
          return idx - 1;
        }).filter(i => i>=0 && i<verts.length);
        for (let i=1;i<idxs.length-1;i++){
          const a=verts[idxs[0]], b=verts[idxs[i]], c=verts[idxs[i+1]];
          positions.push(a[0],a[1],a[2], b[0],b[1],b[2], c[0],c[1],c[2]);
        }
      }
    }
    return positions.length ? new Float32Array(positions) : null;
  }

  function parseSTLAscii(text){
    const positions = [];
    const vertRe = /vertex\s+([\-\d.eE+]+)\s+([\-\d.eE+]+)\s+([\-\d.eE+]+)/g;
    let m;
    while ((m = vertRe.exec(text)) !== null){
      positions.push(parseFloat(m[1]), parseFloat(m[2]), parseFloat(m[3]));
    }
    return positions.length ? new Float32Array(positions) : null;
  }

  function parseSTLBinary(buffer){
    const dv = new DataView(buffer);
    if (buffer.byteLength < 84) return null;
    const triCount = dv.getUint32(80, true);
    if (triCount <= 0 || 84 + triCount*50 > buffer.byteLength + 2) return null;
    const positions = new Float32Array(triCount*9);
    let offset = 84, p = 0;
    for (let i=0;i<triCount;i++){
      offset += 12; // skip normal
      for (let v=0; v<3; v++){
        positions[p++] = dv.getFloat32(offset, true); offset+=4;
        positions[p++] = dv.getFloat32(offset, true); offset+=4;
        positions[p++] = dv.getFloat32(offset, true); offset+=4;
      }
      offset += 2; // attribute byte count
    }
    return positions;
  }

  function parseSTL(buffer){
    const head = new TextDecoder('utf-8').decode(new Uint8Array(buffer, 0, Math.min(512, buffer.byteLength)));
    if (/^\s*solid\b/i.test(head) && head.toLowerCase().includes('facet')){
      return parseSTLAscii(new TextDecoder('utf-8').decode(buffer));
    }
    return parseSTLBinary(buffer);
  }

  function addImportedGeometry(positions){
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.computeBoundingBox();
    const bb = geo.boundingBox;
    const size = new THREE.Vector3(); bb.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z, 0.0001);
    const target = 3.2;
    const scale = target / maxDim;
    const cx = (bb.min.x+bb.max.x)/2, cz = (bb.min.z+bb.max.z)/2;
    geo.translate(-cx, -bb.min.y, -cz);
    geo.scale(scale, scale, scale);
    geo.computeVertexNormals();

    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0xffd166, roughness:.45, metalness:.15}));
    mesh.castShadow = true;
    mesh.userData = {custom:true};
    const spawnPos = screenToGround(window.innerWidth/2, window.innerHeight/2) || new THREE.Vector3(0,0,0);
    mesh.position.set(spawnPos.x, 0, spawnPos.z);
    scene.add(mesh);
    const obj = {mesh, type:'imported'};
    objects.push(obj);
    updateCount();
    setMode('select');
    select(obj);
    toast('Modelo 3D importado');
  }

  /* ============ SELECTION / HIGHLIGHT ============ */
  function select(obj){
    if (selected === obj) return;
    deselect();
    selected = obj;
    obj.mesh.material.emissive = new THREE.Color(0xffffff);
    obj.mesh.material.emissiveIntensity = 0.35;
    setTransformButtonsEnabled(true);
  }
  function deselect(){
    if (selected){
      selected.mesh.material.emissiveIntensity = 0;
    }
    selected = null;
    setTransformButtonsEnabled(false);
  }
  function setTransformButtonsEnabled(on){
    ['btn-move','btn-rotate','btn-scale','btn-delete'].forEach(id=>{
      document.getElementById(id).disabled = !on;
    });
  }

  /* ============ MODE / TOOLBAR WIRING ============ */
  const toolbarEl = document.getElementById('toolbar');
  const btnDraw = document.getElementById('btn-draw');
  const btnSelect = document.getElementById('btn-select');
  const btnTop = document.getElementById('btn-top');
  const btnMove = document.getElementById('btn-move');
  const btnRotate = document.getElementById('btn-rotate');
  const btnScale = document.getElementById('btn-scale');
  const btnDelete = document.getElementById('btn-delete');
  const btnClear = document.getElementById('btn-clear');
  const btnSymmetry = document.getElementById('btn-symmetry');
  const btnClearSketch = document.getElementById('btn-clear-sketch');
  const btnConvert = document.getElementById('btn-convert');
  const btnImportImage = document.getElementById('btn-import-image');
  const btnImportModel = document.getElementById('btn-import-model');
  const fileImage = document.getElementById('file-image');
  const fileModel = document.getElementById('file-model');
  const modeLabel = document.getElementById('modelabel');

  function setMode(m){
    const prev = mode;
    const wasSketch = (prev === 'draw' || prev === 'top');
    const willSketch = (m === 'draw' || m === 'top');
    mode = m;
    btnDraw.classList.toggle('active', m==='draw');
    btnSelect.classList.toggle('active', m==='select');
    btnTop.classList.toggle('active', m==='top');
    toolbarEl.classList.toggle('mode-top', m==='top');
    toolbarEl.classList.toggle('mode-sketch', willSketch);
    overlay.classList.toggle('mode-select', m==='select');
    modeLabel.textContent = m==='draw' ? 'Dibujar' : m==='select' ? 'Seleccionar' : 'Vista superior';
    if (m !== 'select') deselect();
    if (wasSketch && prev !== m) exitSketchMode();
    if (willSketch) enterSketchMode(m);
  }
  function setTransformMode(tm){
    transformMode = tm;
    btnMove.classList.toggle('active', tm==='move');
    btnRotate.classList.toggle('active', tm==='rotate');
    btnScale.classList.toggle('active', tm==='scale');
  }

  const SYM_ORDER = ['h','v','both','none'];
  const SYM_LABEL = {h:'Simetría: izquierda-derecha', v:'Simetría: frente-atrás', both:'Simetría: 4 ejes', none:'Sin simetría'};
  const SYM_ICON = {h:'⟷', v:'↕', both:'✳', none:'⋯'};

  btnDraw.addEventListener('click', ()=>setMode('draw'));
  btnSelect.addEventListener('click', ()=>setMode('select'));
  btnTop.addEventListener('click', ()=>setMode('top'));
  btnMove.addEventListener('click', ()=>setTransformMode('move'));
  btnRotate.addEventListener('click', ()=>setTransformMode('rotate'));
  btnScale.addEventListener('click', ()=>setTransformMode('scale'));
  btnSymmetry.addEventListener('click', ()=>{
    const i = SYM_ORDER.indexOf(symmetryMode);
    symmetryMode = SYM_ORDER[(i+1) % SYM_ORDER.length];
    btnSymmetry.textContent = SYM_ICON[symmetryMode];
    btnSymmetry.title = SYM_LABEL[symmetryMode];
    redrawTopCanvas();
  });
  btnClearSketch.addEventListener('click', ()=>{
    topStrokes = [];
    redrawTopCanvas();
  });
  btnConvert.addEventListener('click', ()=>{
    if (!topStrokes.length){ toast('No hay boceto para convertir'); return; }
    let created = 0, skipped = 0;
    for (const s of topStrokes){
      const shape = classify(s.points);
      if (shape){ spawn(shape); created++; } else { skipped++; }
    }
    topStrokes = [];
    octx.clearRect(0,0,overlay.width, overlay.height);
    toast(created + ' objeto(s) creados' + (skipped ? ', ' + skipped + ' trazo(s) no reconocidos' : ''));
    setMode('select');
  });
  btnDelete.addEventListener('click', ()=>{
    if (!selected) return;
    scene.remove(selected.mesh);
    const i = objects.indexOf(selected);
    if (i>=0) objects.splice(i,1);
    deselect();
    updateCount();
  });
  btnClear.addEventListener('click', ()=>{
    for (const o of objects) scene.remove(o.mesh);
    objects.length = 0;
    deselect();
    updateCount();
  });
  btnImportImage.addEventListener('click', ()=> fileImage.click());
  fileImage.addEventListener('change', (e)=>{
    const f = e.target.files[0];
    fileImage.value = '';
    if (f) importImageFile(f);
  });
  btnImportModel.addEventListener('click', ()=> fileModel.click());
  fileModel.addEventListener('change', (e)=>{
    const f = e.target.files[0];
    fileModel.value = '';
    if (!f) return;
    const name = f.name.toLowerCase();
    if (name.endsWith('.obj')){
      const r = new FileReader();
      r.onload = () => {
        const pos = parseOBJ(r.result);
        if (!pos) toast('No se pudo leer el archivo .obj');
        else addImportedGeometry(pos);
      };
      r.onerror = () => toast('Error leyendo el archivo .obj');
      r.readAsText(f);
    } else if (name.endsWith('.stl')){
      const r = new FileReader();
      r.onload = () => {
        let pos = null;
        try { pos = parseSTL(r.result); } catch(err){ pos = null; }
        if (!pos || !pos.length) toast('No se pudo leer el archivo .stl');
        else addImportedGeometry(pos);
      };
      r.onerror = () => toast('Error leyendo el archivo .stl');
      r.readAsArrayBuffer(f);
    } else {
      toast('Formato no soportado — usá .obj o .stl');
    }
  });
  setTransformMode('move');
  setMode('draw');

  /* ============ POINTER EVENTS (unified) ============ */
  overlay.addEventListener('contextmenu', e=>e.preventDefault());

  overlay.addEventListener('pointerdown', (e)=>{
    if (e.button === 2){
      if (mode !== 'top'){ orbiting = true; lastX=e.clientX; lastY=e.clientY; }
      return;
    }
    if (e.button !== 0) return;

    if (mode === 'draw' || mode === 'top'){
      topCurrent = {points: [{x:e.clientX, y:e.clientY}]};
    } else {
      const hit = pickObject(e.clientX, e.clientY);
      if (hit){
        select(hit);
        dragging = true;
        dragStart = {x:e.clientX, y:e.clientY};
        initialScale = hit.mesh.scale.clone();
        initialRotY = hit.mesh.rotation.y;
      } else {
        deselect();
      }
    }
  });

  overlay.addEventListener('pointermove', (e)=>{
    if (orbiting){
      const dx = e.clientX-lastX, dy = e.clientY-lastY;
      theta -= dx*0.006;
      phi -= dy*0.006;
      lastX=e.clientX; lastY=e.clientY;
      updateCamera();
      return;
    }

    if ((mode==='draw' || mode==='top') && topCurrent){
      const pts = topCurrent.points;
      pts.push({x:e.clientX, y:e.clientY});
      const n = pts.length;
      drawSeg(pts[n-2], pts[n-1], '#7dd3fc');
      if (mode==='top'){
        for (const kind of getMirrorKinds()){
          drawSeg(mirrorPoint(pts[n-2], kind), mirrorPoint(pts[n-1], kind), 'rgba(167,139,250,0.85)');
        }
      }
      return;
    }

    if (mode==='select' && dragging && selected){
      if (transformMode === 'move'){
        const p = screenToGround(e.clientX, e.clientY);
        if (p){
          selected.mesh.position.x = p.x;
          selected.mesh.position.z = p.z;
        }
      } else if (transformMode === 'rotate'){
        const dx = e.clientX - dragStart.x;
        selected.mesh.rotation.y = initialRotY + dx*0.012;
      } else if (transformMode === 'scale'){
        const dy = dragStart.y - e.clientY;
        const factor = Math.max(0.25, Math.min(4.5, 1 + dy*0.006));
        selected.mesh.scale.set(
          initialScale.x*factor, initialScale.y*factor, initialScale.z*factor
        );
        selected.mesh.position.y = restY(selected);
      }
    }
  });

  overlay.addEventListener('pointerup', (e)=>{
    if (orbiting){ orbiting=false; return; }

    if ((mode==='draw' || mode==='top') && topCurrent){
      const pts = topCurrent.points;
      if (pts.length >= 3){
        topStrokes.push({points: pts, color: '#7dd3fc'});
        if (mode === 'top'){
          for (const kind of getMirrorKinds()){
            topStrokes.push({points: pts.map(p=>mirrorPoint(p,kind)), color: 'rgba(167,139,250,0.85)'});
          }
        }
      }
      topCurrent = null;
    }

    dragging = false;
  });

  overlay.addEventListener('pointerleave', ()=>{
    orbiting=false; dragging=false;
    if (topCurrent){ topCurrent=null; redrawTopCanvas(); }
  });

  overlay.addEventListener('wheel', (e)=>{
    if (mode === 'top'){
      camTop.zoom = Math.max(0.4, Math.min(3, camTop.zoom - e.deltaY*0.001));
      camTop.updateProjectionMatrix();
    } else {
      radius += e.deltaY*0.012;
      updateCamera();
    }
    e.preventDefault();
  }, {passive:false});

  } catch (err){
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:16px;z-index:99999;background:#1a0e10;color:#ff9d9d;'
      + 'border:1px solid #7a2b2b;border-radius:10px;padding:16px;font:12px monospace;'
      + 'white-space:pre-wrap;overflow:auto;max-height:80vh;';
    box.textContent = 'Error al iniciar la escena 3D:\n\n' + (err && err.stack ? err.stack : err);
    document.body.appendChild(box);
    console.error(err);
  }
})();
</script>
</body>
</html>
