<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Boceto 3D — de trazo a sólido</title>
<style>
  :root{
    --bg: #0b1020;
    --panel: #11172b;
    --line: #24304d;
    --ink: #dbe4ff;
    --dim: #7c89ad;
    --amber: #f0a339;   /* triángulo -> prisma */
    --cyan: #3fc7e0;    /* círculo -> esfera */
    --mint: #4fd6a4;    /* línea -> cilindro */
    --accent: #7c8cff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:'Courier New',ui-monospace,monospace;color:var(--ink);}
  #stage{position:fixed;inset:0;}
  #scene{position:absolute;inset:0;pointer-events:none;}
  #overlay{position:absolute;inset:0;touch-action:none;cursor:crosshair;}
  #overlay.mode-select{cursor:default;}

  /* ---- Top bar: drafting-table control strip ---- */
  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:center;
    padding:14px 18px; z-index:10; pointer-events:none;
  }

  #toolbar{
    pointer-events:none;
    display:flex; gap:14px; align-items:center;
    background:rgba(17,23,43,.9); border:1px solid var(--line);
    border-radius:20px; padding:10px; backdrop-filter: blur(6px);
    opacity:0; transform:translateY(-8px);
    transition:opacity .2s ease, transform .2s ease;
  }
  #toolbar.visible{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .grp{display:flex; gap:2px; padding:0 6px; border-right:1px solid var(--line);}
  .grp:last-child{border-right:none;}
  button{
    font-family:inherit; font-size:12px; letter-spacing:.04em;
    background:transparent; color:var(--dim); border:1px solid transparent;
    border-radius:7px; padding:8px 12px; cursor:pointer; transition:.15s;
  }
  button:hover{color:var(--ink); background:rgba(124,140,255,.08);}
  button.active{color:#0b1020; background:var(--accent); font-weight:700;}
  button.danger:hover{color:#ff8080; background:rgba(255,90,90,.1);}
  button:disabled{opacity:.35; cursor:not-allowed;}
  button:disabled:hover{background:transparent; color:var(--dim);}

  button.icon{
    box-sizing:border-box; width:56px; height:56px; padding:0; line-height:1;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; border-radius:50%; aspect-ratio:1/1;
    background:#0c3c3c; color:#d8fff5;
    border:2px solid rgba(255,255,255,.18);
    box-shadow:0 4px 0 rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.12);
    transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
  }
  button.icon i{ font-size:1em; }
  button.icon svg{ width:1.4em; height:1.4em; fill:currentColor; overflow:visible; display:block; }
  button.icon:hover{ transform:translateY(-3px) scale(1.08); filter:brightness(1.12); }
  button.icon:active{ transform:translateY(2px) scale(0.92); filter:brightness(0.92); box-shadow:0 1px 0 rgba(0,0,0,.28); }
  button.icon.active{ background:#0c3c3c; color:#d8fff5; font-weight:400; box-shadow:0 4px 0 rgba(0,0,0,.28), 0 0 0 4px rgba(255,255,255,.55); }
  button.icon:disabled{ box-shadow:0 4px 0 rgba(0,0,0,.15); }
  .top-only{display:none;}
  #toolbar.mode-sketch.view-ortho .top-only{display:flex;}
  .sketch-only{display:none;}
  #toolbar.mode-sketch .sketch-only{display:flex;}
  button.cta{
    background:var(--mint); color:#04241a; font-weight:700; padding:8px 14px; font-size:12.5px;
  }
  button.cta:hover{background:#65e0b6; color:#04241a;}

  /* ---- Legend, bottom-left ---- */
  #legend{
    position:absolute; left:18px; bottom:60px; z-index:10;
    max-width:260px;
    font-size:11px; color:var(--dim); line-height:1.9;
    background:rgba(17,23,43,.72); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px;
    opacity:0; transform:translateY(6px); pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  #legend.visible{ opacity:1; transform:translateY(0); pointer-events:auto; }
  #help-slide{
    font-size:17px; font-weight:700; color:var(--ink); line-height:1.4;
    min-height:64px; display:flex; align-items:center;
    opacity:1; transform:translateY(0);
    transition:opacity .3s ease, transform .3s ease;
  }
  #help-slide.fade{ opacity:0; transform:translateY(8px); }
  #help-dots{ display:flex; gap:6px; justify-content:center; margin-top:10px; }
  #help-dots span{ width:6px; height:6px; border-radius:50%; background:var(--line); transition:background .2s; }
  #help-dots span.on{ background:var(--accent); }

  #btn-help{
    position:absolute; left:18px; bottom:16px; z-index:11;
    width:34px; height:34px; border-radius:50%; padding:0;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:700;
    background:#0c3c3c; color:#d8fff5;
    border:2px solid rgba(255,255,255,.18);
    box-shadow:0 3px 0 rgba(0,0,0,.28);
  }
  #btn-help:active{ transform:translateY(2px); box-shadow:none; }

  /* ---- Toast ---- */
  #toast{
    position:absolute; top:76px; left:50%; transform:translate(-50%,-8px);
    background:rgba(17,23,43,.95); border:1px solid var(--line);
    color:var(--ink); font-size:12px; padding:8px 14px; border-radius:8px;
    opacity:0; transition:opacity .25s, transform .25s; z-index:20; pointer-events:none;
    white-space:nowrap;
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}

  /* ---- Grebble panel, floats under the toolbar ---- */
  #grebble-panel{
    position:absolute; top:86px; left:50%; transform:translate(-50%,-8px);
    display:none; align-items:center; gap:10px; z-index:15;
    background:rgba(17,23,43,.95); border:1px solid var(--line);
    border-radius:12px; padding:9px 16px;
    opacity:0; transition:opacity .2s ease, transform .2s ease;
  }
  #grebble-panel.visible{ display:flex; opacity:1; transform:translate(-50%,0); }
  #grebble-label{ font-size:11px; color:var(--dim); letter-spacing:.04em; }
  #grebble-count{ font-size:12px; color:var(--ink); font-weight:700; min-width:1.6em; text-align:right; }
  #grebble-slider{
    -webkit-appearance:none; appearance:none; width:140px; height:4px;
    border-radius:2px; background:var(--line); outline:none; cursor:pointer;
  }
  #grebble-slider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:16px; height:16px; border-radius:50%;
    background:#d8fff5; border:2px solid #0c3c3c; cursor:pointer;
  }
  #grebble-slider::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%;
    background:#d8fff5; border:2px solid #0c3c3c; cursor:pointer;
  }

  /* ---- Mode badge, bottom-right ---- */
  #modebadge{
    position:absolute; right:18px; bottom:16px; z-index:10;
    font-size:11px; color:var(--dim);
    background:rgba(17,23,43,.72); border:1px solid var(--line);
    border-radius:10px; padding:10px 14px; text-align:right;
  }
  #modebadge b{color:var(--ink);}
</style>
</head>
<body>

<div id="stage">
  <canvas id="scene"></canvas>
  <canvas id="overlay"></canvas>

  <div id="hud">
    <div id="toolbar">
      <div class="grp">
        <button id="btn-draw" class="icon active" title="Dibujar"><svg viewBox="0 0 24 24"><g transform="rotate(45 12 12)"><rect x="9" y="1" width="6" height="3"/><rect x="9" y="4" width="6" height="14" rx="1"/><polygon points="9,18 15,18 12,22"/></g></svg></button>
        <button id="btn-select" class="icon" title="Seleccionar"><svg viewBox="0 0 24 24"><path d="M4 2l14 14-5 1 3 6-3 1-3-6-4 4V2z"/></svg></button>
      </div>
      <div class="grp">
        <button id="btn-view-top" class="icon active" title="Vista superior"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></button>
        <button id="btn-view-front" class="icon" title="Vista frontal"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
        <button id="btn-view-side" class="icon" title="Vista lateral"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 8l5-3v14l-5-3V8z"/></svg></button>
        <button id="btn-view-persp" class="icon" title="Perspectiva"><svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 2v10M3 7l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="grp">
        <button id="btn-move" class="icon" disabled title="Mover"><svg viewBox="0 0 24 24"><path d="M12 2l3 3h-2v5h5v-2l3 3-3 3v-2h-5v5h2l-3 3-3-3h2v-5H7v2l-3-3 3-3v2h5V5h-2l3-3z"/></svg></button>
        <button id="btn-rotate" class="icon" disabled title="Rotar"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 7.6 5.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><polygon points="21,3 21,10 14,7"/></svg></button>
        <button id="btn-scale" class="icon" disabled title="Escalar: toca y arrastra"><svg viewBox="0 0 24 24"><path d="M4 4h7V6H6v5H4V4z"/><path d="M20 20h-7v-2h5v-5h2v7z"/><path d="M4 20l7-7M13 4l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
      </div>
      <div class="grp">
        <button id="btn-shape" class="icon" title="Figura básica: Prisma"><svg viewBox="0 0 24 24"><path d="M12 2l9 6-9 6-9-6 9-6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 8v8l9 6 9-6V8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
        <button id="btn-grebble" class="icon" title="Grebble: desactivado"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.7"/><circle cx="16" cy="8" r="1.7"/><circle cx="8" cy="16" r="1.7"/><circle cx="16" cy="16" r="1.7"/><circle cx="12" cy="12" r="1.7"/></svg></button>
      </div>
      <div class="grp top-only">
        <button id="btn-symmetry" class="icon" title="Simetría: izquierda-derecha"><svg viewBox="0 0 24 24"><rect x="11" y="2" width="2" height="20"/><path d="M9 6L3 12l6 6V6z"/><path d="M15 6l6 6-6 6V6z"/></svg></button>
      </div>
      <div class="grp sketch-only">
        <button id="btn-clear-sketch" class="icon" title="Borrar boceto"><svg viewBox="0 0 24 24"><g transform="rotate(45 12 12)"><rect x="4" y="8" width="16" height="8" rx="2"/><rect x="4" y="8" width="6" height="8" rx="2" opacity="0.5"/></g></svg></button>
        <button id="btn-convert" class="icon" title="Convertir a 3D"><svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 2v10M3 7l9 5 9-5M12 12v10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="grp">
        <button id="btn-import-image" class="icon" title="Importar dibujo (imagen)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M4 17l5-5 3 3 4-5 5 6.5V18a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-1z"/></svg></button>
        <button id="btn-import-model" class="icon" title="Importar modelo (.obj / .stl)"><svg viewBox="0 0 24 24"><path d="M4 9h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9z" opacity="0.9"/><path d="M2 9l4-5h4l2 3 2-3h4l4 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
      </div>
      <div class="grp">
        <button id="btn-delete" class="icon" disabled title="Eliminar seleccionado"><svg viewBox="0 0 24 24"><path d="M5 7h14l-1.2 13.1A2 2 0 0 1 15.8 22H8.2a2 2 0 0 1-2-1.9L5 7z"/><path d="M9 4h6l1 3H8l1-3z"/><rect x="3" y="7" width="18" height="2"/></svg></button>
        <button id="btn-clear" class="icon" title="Borrar todo"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg></button>
      </div>
    </div>
  </div>

  <input type="file" id="file-image" accept="image/*" style="display:none">
  <input type="file" id="file-model" accept=".obj,.stl" style="display:none">

  <button id="btn-help" title="Ayuda">?</button>
  <div id="legend">
    <div id="help-slide"></div>
    <div id="help-dots"></div>
  </div>

  <div id="modebadge">Modo: <b id="modelabel">Dibujar</b> · Vista: <b id="viewlabel">Superior</b><br>Objetos: <b id="objcount">0</b></div>

  <div id="toast"></div>

  <div id="grebble-panel">
    <span id="grebble-label">Grebble</span>
    <input type="range" id="grebble-slider" min="0" max="60" step="1" value="18">
    <span id="grebble-count">18</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<script>
(function(){
  "use strict";
  try {

  /* ============ THREE.JS SCENE SETUP ============ */
  const sceneCanvas = document.getElementById('scene');
  const overlay = document.getElementById('overlay');
  const octx = overlay.getContext('2d');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1020);
  scene.fog = new THREE.Fog(0x0b1020, 18, 42);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 200);
  const ORTHO_HALF = 15;
  const camOrtho = new THREE.OrthographicCamera(-ORTHO_HALF, ORTHO_HALF, ORTHO_HALF, -ORTHO_HALF, 0.1, 100);
  let activeCam = camera; // swapped to camOrtho for top/front/side views

  function applyView(v){
    if (v === 'top'){
      camOrtho.position.set(0,30,0); camOrtho.up.set(0,0,-1); camOrtho.lookAt(0,0,0);
      activeCam = camOrtho;
    } else if (v === 'front'){
      camOrtho.position.set(0,0,30); camOrtho.up.set(0,1,0); camOrtho.lookAt(0,0,0);
      activeCam = camOrtho;
    } else if (v === 'side'){
      camOrtho.position.set(30,0,0); camOrtho.up.set(0,1,0); camOrtho.lookAt(0,0,0);
      activeCam = camOrtho;
    } else {
      activeCam = camera; // perspective
    }
  }
  function axisForView(v){ return v === 'front' ? 'z' : v === 'side' ? 'x' : 'y'; }
  function freeAxesForView(v){
    const d = axisForView(v);
    return ['x','y','z'].filter(a=>a!==d);
  }
  function getPlacementPlane(v){
    if (v === 'front') return new THREE.Plane(new THREE.Vector3(0,0,1), 0);
    if (v === 'side') return new THREE.Plane(new THREE.Vector3(1,0,0), 0);
    return new THREE.Plane(new THREE.Vector3(0,1,0), 0); // top & perspective -> ground
  }

  /* ============ STATE ============ */
  let mode = 'draw';            // 'draw' (sketch) | 'select'
  let view = 'top';             // 'top' | 'front' | 'side' | 'perspective'
  let transformMode = 'move';   // 'move' | 'rotate'
  const objects = [];           // {mesh, type}
  let selected = null;

  let symmetryMode = 'h';       // 'none' | 'h' | 'v' | 'both'
  let grebbleAutoOn = false;    // si está activo, se añade grebble a cada objeto al convertir
  let grebbleDensity = 18;      // cantidad de grebble a aplicar
  let topCurrent = null;        // {points:[...]} stroke being drawn
  let topStrokes = [];          // accumulated {points, color} until conversion

  let orbiting = false, lastX=0, lastY=0;
  let dragging = false, dragStart = {x:0,y:0};
  let initialRot = 0;
  let initialScale = 1;
  let activeAxis = null; // null | 'x' | 'y' | 'z' — eje bloqueado por el manipulador
  let axisDragStartValue = 0, axisDragStartRot = 0, axisDragStartScale = 1, axisScreenPerUnit = null;

  let pressTimer = null, pressStart = {x:0,y:0};

  const activePointers = new Map(); // pointerId -> {x,y}, for 2-finger pinch-to-scale
  let pinchStartDist = null, pinchStartScale = null;
  let twoFingerPrev = null; // {cx,cy,d,ang} previous frame's two-finger touch state (perspective nav)

  const raycaster = new THREE.Raycaster();

  const renderer = new THREE.WebGLRenderer({canvas: sceneCanvas, antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const ambient = new THREE.AmbientLight(0x3b4a7a, 0.9);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xfff2da, 1.15);
  sun.position.set(8, 14, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
  sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x5566ff, 0.25);
  rim.position.set(-10,4,-8);
  scene.add(rim);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(60,60),
    new THREE.MeshStandardMaterial({color:0x121a33, roughness:1, metalness:0})
  );
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  const grid = new THREE.GridHelper(60, 60, 0x2a3660, 0x1a2340);
  grid.position.y = 0.001;
  scene.add(grid);

  /* ---- Manipulador de ejes (gizmo): elige X/Y/Z antes de mover/rotar/escalar ---- */
  const gizmo = new THREE.Group();
  gizmo.visible = false;
  gizmo.renderOrder = 999;
  scene.add(gizmo);

  const AXIS_COLOR = { x: 0xff4d4d, y: 0x4dff8f, z: 0x4d9fff };
  const AXIS_COLOR_ACTIVE = 0xffee55;
  const axisHandles = {};

  function buildAxisHandle(axis){
    const dir = new THREE.Vector3(axis==='x'?1:0, axis==='y'?1:0, axis==='z'?1:0);
    const grp = new THREE.Group();
    const color = AXIS_COLOR[axis];

    const shaftMat = new THREE.MeshBasicMaterial({color, depthTest:false, transparent:true, opacity:0.95});
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.78, 10), shaftMat);
    shaft.position.y = 0.39;

    const headMat = new THREE.MeshBasicMaterial({color, depthTest:false, transparent:true, opacity:0.95});
    const head = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.26, 14), headMat);
    head.position.y = 0.78 + 0.13;

    // hitbox invisible más ancho, para que sea fácil tocarlo con el dedo
    const hit = new THREE.Mesh(
      new THREE.CylinderGeometry(0.17, 0.17, 1.05, 8),
      new THREE.MeshBasicMaterial({visible:false})
    );
    hit.position.y = 0.52;
    hit.userData.axis = axis;

    grp.add(shaft, head, hit);
    grp.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir));
    gizmo.add(grp);
    axisHandles[axis] = {shaft, head, hit};
  }
  ['x','y','z'].forEach(buildAxisHandle);

  function setGizmoHighlight(axis){
    ['x','y','z'].forEach(a=>{
      const c = (a === axis) ? AXIS_COLOR_ACTIVE : AXIS_COLOR[a];
      axisHandles[a].shaft.material.color.setHex(c);
      axisHandles[a].head.material.color.setHex(c);
    });
  }

  function updateGizmo(){
    if (!selected || mode !== 'select'){ gizmo.visible = false; return; }
    gizmo.visible = true;
    gizmo.position.copy(selected.mesh.position);
    let radius = 1;
    try {
      selected.mesh.geometry.computeBoundingSphere();
      const bs = selected.mesh.geometry.boundingSphere;
      if (bs) radius = bs.radius * Math.max(selected.mesh.scale.x, selected.mesh.scale.y, selected.mesh.scale.z);
    } catch(e){}
    gizmo.scale.setScalar(Math.min(Math.max(radius*1.6, 0.9), 6));
    setGizmoHighlight(activeAxis);
  }

  function worldToScreen(v){
    const p = v.clone().project(activeCam);
    return { x: (p.x*0.5+0.5)*window.innerWidth, y: (1-(p.y*0.5+0.5))*window.innerHeight };
  }

  /* ---- Orbit camera (custom, no addons) ---- */
  const target = new THREE.Vector3(0,1,0);
  let radius = 13, theta = Math.PI*0.28, phi = Math.PI*0.32;
  function updateCamera(){
    phi = Math.max(0.12, Math.min(Math.PI-0.12, phi));
    radius = Math.max(4, Math.min(30, radius));
    camera.position.set(
      target.x + radius*Math.sin(phi)*Math.sin(theta),
      target.y + radius*Math.cos(phi),
      target.z + radius*Math.sin(phi)*Math.cos(theta)
    );
    camera.lookAt(target);
  }
  updateCamera();

  function panCamera(dxPix, dyPix){
    const offset = new THREE.Vector3().subVectors(camera.position, target);
    let d = offset.length();
    d *= Math.tan((camera.fov/2)*Math.PI/180);
    const panX = 2*dxPix*d/window.innerHeight;
    const panY = 2*dyPix*d/window.innerHeight;
    camera.updateMatrixWorld(true);
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    const camUp = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    const move = new THREE.Vector3();
    move.addScaledVector(right, -panX);
    move.addScaledVector(camUp, panY);
    target.add(move);
  }

  function panOrtho(dxPix, dyPix){
    camOrtho.updateMatrixWorld(true);
    const right = new THREE.Vector3().setFromMatrixColumn(camOrtho.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camOrtho.matrixWorld, 1);
    const viewHeightWorld = (camOrtho.top - camOrtho.bottom) / camOrtho.zoom;
    const worldPerPixel = viewHeightWorld / window.innerHeight;
    const move = new THREE.Vector3();
    move.addScaledVector(right, -dxPix*worldPerPixel);
    move.addScaledVector(up, dyPix*worldPerPixel);
    camOrtho.position.add(move);
  }

  function updateOrthoFrustum(){
    const aspect = window.innerWidth/window.innerHeight;
    camOrtho.left = -ORTHO_HALF*aspect;
    camOrtho.right = ORTHO_HALF*aspect;
    camOrtho.top = ORTHO_HALF;
    camOrtho.bottom = -ORTHO_HALF;
    camOrtho.updateProjectionMatrix();
  }

  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w/h; camera.updateProjectionMatrix();

  function ndc(clientX, clientY){
    return new THREE.Vector2(
      (clientX/window.innerWidth)*2 - 1,
      -(clientY/window.innerHeight)*2 + 1
    );
  }

  function screenToWorld(clientX, clientY){
    const m = ndc(clientX, clientY);
    raycaster.setFromCamera(m, activeCam);
    const pt = new THREE.Vector3();
    const hit = raycaster.ray.intersectPlane(getPlacementPlane(view), pt);
    return hit ? pt : null;
  }

  function pickObject(clientX, clientY){
    const m = ndc(clientX, clientY);
    raycaster.setFromCamera(m, activeCam);
    const meshes = objects.map(o=>o.mesh);
    const hits = raycaster.intersectObjects(meshes, false);
    if (!hits.length) return null;
    return objects.find(o=>o.mesh === hits[0].object) || null;
  }

  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  /* ============ TOP-VIEW SYMMETRY HELPERS ============ */
  function mirrorPoint(p, kind){
    const W = overlay.width, H = overlay.height;
    if (kind === 'h') return {x: W-p.x, y: p.y};
    if (kind === 'v') return {x: p.x, y: H-p.y};
    return {x: W-p.x, y: H-p.y}; // 'both'
  }
  function getMirrorKinds(){
    if (symmetryMode === 'h') return ['h'];
    if (symmetryMode === 'v') return ['v'];
    if (symmetryMode === 'both') return ['h','v','both'];
    return [];
  }
  function drawSeg(a, b, color){
    octx.strokeStyle = color; octx.lineWidth = 20; octx.lineCap='round'; octx.lineJoin='round';

  function drawStrokePath(points, color){
    if (points.length < 2) return;
    octx.strokeStyle = color; octx.lineWidth = 20; octx.lineCap='round'; octx.lineJoin='round';
    octx.beginPath();
    octx.moveTo(points[0].x, points[0].y);
    for (let i=1;i<points.length;i++) octx.lineTo(points[i].x, points[i].y);

  function drawTopGuides(){
    if (mode !== 'draw' || view === 'perspective') return;
    const W = overlay.width, H = overlay.height;
    octx.save();
    octx.setLineDash([6,6]);
    octx.strokeStyle = 'rgba(124,140,255,0.35)';

      octx.beginPath(); octx.moveTo(W/2,0); octx.lineTo(W/2,H); octx.stroke();
    }
    if (symmetryMode === 'v' || symmetryMode === 'both'){
      octx.beginPath(); octx.moveTo(0,H/2); octx.lineTo(W,H/2); octx.stroke();
    }
    octx.restore();
  }
  function redrawTopCanvas(){

    drawTopGuides();
    for (const s of topStrokes) drawStrokePath(s.points, s.color);

  function enterSketchMode(){
    redrawTopCanvas();
  }
  function exitSketchMode(){
    if (topStrokes.length) toast('Boceto descartado (sin convertir)');
    topStrokes = [];
    topCurrent = null;

  /* ============ SHAPE CLASSIFICATION ============ */
  function pathLength(pts){
    let L=0; for(let i=1;i<pts.length;i++) L += dist(pts[i-1],pts[i]);
    return L;
  }
  function bbox(pts){
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for(const p of pts){ if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; }
    return {minX,maxX,minY,maxY,w:maxX-minX,h:maxY-minY};
  }
  function shoelaceArea(pts){
    let a=0;
    for(let i=0;i<pts.length;i++){
      const p1=pts[i], p2=pts[(i+1)%pts.length];
      a += p1.x*p2.y - p2.x*p1.y;
    }
    return Math.abs(a)/2;
  }
  function perpDist(p,a,b){
    const num = Math.abs((p.x-a.x)*(b.y-a.y) - (p.y-a.y)*(b.x-a.x));
    const den = dist(a,b) || 1;
    return num/den;
  }
  function douglasPeucker(pts, epsilon){
    if (pts.length < 3) return pts.slice();
    const a = pts[0], b = pts[pts.length-1];
    let maxD=-1, idx=-1;
    for(let i=1;i<pts.length-1;i++){
      const d = perpDist(pts[i], a, b);
      if (d>maxD){ maxD=d; idx=i; }
    }
    if (maxD > epsilon){
      const left = douglasPeucker(pts.slice(0, idx+1), epsilon);
      const right = douglasPeucker(pts.slice(idx), epsilon);
      return left.slice(0,-1).concat(right);
    }
    return [a,b];
  }

  function classify(pts){
    if (pts.length < 4) return null;
    const box = bbox(pts);
    const diag = Math.hypot(box.w, box.h);
    if (diag < 14) return null;

    const start = pts[0], end = pts[pts.length-1];
    const closeGap = dist(start,end);
    const perim = pathLength(pts);
    const closed = closeGap < Math.max(diag*0.30, 20);

    if (!closed){
      const lineLen = dist(start,end);
      let maxDev = 0;
      for (const p of pts) maxDev = Math.max(maxDev, perpDist(p,start,end));
      if (lineLen > 26 && maxDev < Math.max(lineLen*0.18, 9)){
        return {type:'line', box, start, end, points: pts};
      }
      return null; // open, wobbly -> unrecognized
    }

    // closed shape: footprint used for volume-based reconstruction (see spawn())
    return {type:'closed', box, points: pts};
  }

  /* ============ SPAWNING SHAPES ============ */
  const SCALE = 0.016; // pixels -> world units

  function restCoord(o){
    const u = o.mesh.userData;
    const s = o.mesh.scale.y;
    if (o.type==='esfera') return u.baseRadius*s;
    if (o.type==='base' || o.type==='cubo') return (u.baseHeight*s)/2;
    if (o.type==='line') return u.baseRadius*s;
    return null; // prisma (auto-posicionado) e imported/custom meshes: geometry already rests at 0 locally
  }
  function applyRest(o){
    const ax = o.mesh.userData.restAxis;
    if (!ax) return;
    const c = restCoord(o);
    if (c !== null) o.mesh.position[ax] = c;
  }

  /* ---- Familias de variantes: el intérprete elige al azar dentro de cada familia ---- */
  /* ---- Figura básica activa: el usuario la elige con el botón de figura ---- */
  let basicShape = 'prisma'; // 'base' | 'prisma' | 'esfera' | 'cubo'
  const SHAPE_COLORS = { base:0xd8659b, prisma:0xf0a339, esfera:0x3fc7e0, cubo:0x8f7bf2 };

  const LINE_VARIANTS = [
    (r,len) => new THREE.CylinderGeometry(r, r, len, 14),   // cilindro fino
    (r,len) => new THREE.BoxGeometry(r*1.8, len, r*1.8)     // barra fina
  ];
  function pickVariant(pool){ return pool[Math.floor(Math.random()*pool.length)]; }

  // Extruye el contorno EXACTO del trazo (proyectado en el plano de la vista activa)
  // a lo largo del eje de profundidad de esa vista, usando coordenadas de mundo reales.
  function buildFootprintPrism(points, axis, height){
    let pts2 = douglasPeucker(points, 4);
    if (pts2.length > 1 && dist(pts2[0], pts2[pts2.length-1]) < 3) pts2 = pts2.slice(0, -1);
    if (pts2.length < 3) return null;

    const vec2s = pts2.map(p => new THREE.Vector2(p.x, p.y));
    let tris;
    try { tris = THREE.ShapeUtils.triangulateShape(vec2s, []); } catch(e){ return null; }
    if (!tris || !tris.length) return null;

    const bottomWorld = pts2.map(p => screenToWorld(p.x, p.y));
    if (bottomWorld.some(p => !p)) return null;
    const axisVec = new THREE.Vector3(axis==='x'?1:0, axis==='y'?1:0, axis==='z'?1:0);
    const topWorld = bottomWorld.map(p => p.clone().addScaledVector(axisVec, height));

    const positions = [];
    const pushTri = (a,b,c) => positions.push(a.x,a.y,a.z, b.x,b.y,b.z, c.x,c.y,c.z);
    for (const [a,b,c] of tris) pushTri(bottomWorld[a], bottomWorld[c], bottomWorld[b]); // bottom cap
    for (const [a,b,c] of tris) pushTri(topWorld[a], topWorld[b], topWorld[c]);          // top cap
    const n = pts2.length;
    for (let i=0;i<n;i++){ // side walls
      const j = (i+1)%n;
      pushTri(bottomWorld[i], bottomWorld[j], topWorld[j]);
      pushTri(bottomWorld[i], topWorld[j], topWorld[i]);
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

    // recenter around the shape's own centroid so move/rotate/scale pivot correctly
    geo.computeBoundingBox();
    const c = new THREE.Vector3();
    geo.boundingBox.getCenter(c);
    geo.translate(-c.x, -c.y, -c.z);
    geo.computeVertexNormals();
    return {geo, center: c};
  }

  function spawn(shape){
    const box = shape.box;
    const cx = (box.minX+box.maxX)/2, cy = (box.minY+box.maxY)/2;
    const hitPoint = screenToWorld(cx, cy);
    if (!hitPoint){ toast('No pude ubicar el punto, intenta de nuevo'); return; }
    const axis = axisForView(view);

    let mesh, color, baseRadius=0.5, baseHeight=1, objType = shape.type;

    if (shape.type === 'closed'){
      objType = basicShape;
      color = SHAPE_COLORS[basicShape];
      const areaWorld = Math.max(shoelaceArea(shape.points) * SCALE * SCALE, 0.05);
      const w = Math.max(box.w*SCALE, 0.4);
      const d = Math.max(box.h*SCALE, 0.4);
      const refHeight = Math.max(Math.sqrt(areaWorld)*1.1, 0.5);           // "altura" asumida del boceto
      const targetVolume = Math.max(areaWorld*refHeight, 0.05);            // volumen que debe ocupar el objeto

      const bx = cx, by = cy;
      const first = (shape.points && shape.points[0]) || {x:bx+1, y:by};
      const ang = Math.atan2(first.y-by, first.x-bx);

      if (basicShape === 'cubo'){
        const s = Math.cbrt(targetVolume);
        baseHeight = s;
        const geo = new THREE.BoxGeometry(s, s, s);
        mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:.5, metalness:.15}));
        if (axis === 'y'){ mesh.rotation.y = -ang; } else if (axis === 'z'){ mesh.rotation.z = ang; } else { mesh.rotation.x = ang; }
        mesh.position.copy(hitPoint);
        mesh.position[axis] = baseHeight/2;
      } else if (basicShape === 'esfera'){
        const r = Math.cbrt((3*targetVolume)/(4*Math.PI));
        baseRadius = r;
        const geo = new THREE.SphereGeometry(r, 26, 18);
        mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:.35, metalness:.15}));
        mesh.position.copy(hitPoint);
        mesh.position[axis] = baseRadius;
      } else if (basicShape === 'base'){
        const h = Math.max(targetVolume/(w*d), 0.15);
        baseHeight = h;
        const geo = new THREE.BoxGeometry(w, h, d);
        mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:.55, metalness:.1}));
        if (axis === 'y'){ mesh.rotation.y = -ang; } else if (axis === 'z'){ mesh.rotation.z = ang; } else { mesh.rotation.x = ang; }
        mesh.position.copy(hitPoint);
        mesh.position[axis] = baseHeight/2;
      } else { // prisma: extrusión real del contorno dibujado
        const built = buildFootprintPrism(shape.points, axis, refHeight);
        if (!built){ // fallback si el contorno no se pudo triangular
          const geo = new THREE.BoxGeometry(w, refHeight, d);
          mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:.45, metalness:.15}));
          if (axis === 'y'){ mesh.rotation.y = -ang; } else if (axis === 'z'){ mesh.rotation.z = ang; } else { mesh.rotation.x = ang; }
          mesh.position.copy(hitPoint);
          mesh.position[axis] = refHeight/2;
          baseHeight = refHeight;
        } else {
          mesh = new THREE.Mesh(built.geo, new THREE.MeshStandardMaterial({color, roughness:.45, metalness:.15, side: THREE.DoubleSide}));
          mesh.position.copy(built.center);
          baseHeight = refHeight;
        }
      }
    } else { // line
      color = 0x4fd6a4;
      baseRadius = 0.09;
      const length = Math.max(dist(shape.start, shape.end)*SCALE, 1.1);
      baseHeight = length;
      const build = pickVariant(LINE_VARIANTS);
      const geo = build(baseRadius, length);
      mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:.4, metalness:.2}));
      const ang = Math.atan2(shape.end.y - shape.start.y, shape.end.x - shape.start.x);
      if (axis === 'y'){
        mesh.rotation.z = Math.PI/2;  // Y is the cylinder's own length axis -> flip it into the free plane first
        mesh.rotateY(-ang);
      } else if (axis === 'z'){
        mesh.rotation.z = -ang;       // length (Y) is already in the free (X,Y) plane
      } else {
        mesh.rotation.x = ang;        // length (Y) is already in the free (Y,Z) plane
      }
      const startPt = screenToWorld(shape.start.x, shape.start.y);
      const endPt = screenToWorld(shape.end.x, shape.end.y);
      const mid = startPt && endPt ? startPt.clone().add(endPt).multiplyScalar(0.5) : hitPoint;
      mesh.position.copy(mid);
      mesh.position[axis] = baseRadius;
    }

    mesh.castShadow = true;
    mesh.userData = {baseRadius, baseHeight, baseColor: color, restAxis: axis, greebles: [], grebbleCount: 0};
    scene.add(mesh);
    const obj = {mesh, type: objType};
    objects.push(obj);
    updateCount();
    return obj;
  }

  function updateCount(){
    document.getElementById('objcount').textContent = objects.length;
  }

  /* ============ GREBBLE: detalle de superficie (cubos/cilindros) ============ */
  function buildGrebblePiece(){
    const size = 0.05 + Math.random()*0.09;
    const height = size*(0.8+Math.random()*1.3);
    const isCube = Math.random() < 0.55;
    let geo;
    if (isCube){
      geo = new THREE.BoxGeometry(size, height, size);
    } else {
      const rad = size*0.5;
      geo = new THREE.CylinderGeometry(rad, rad*(0.85+Math.random()*0.3), height, 10);
    }
    const color = isCube ? 0x0c3c3c : 0xbfeee0;
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:.5, metalness:.25}));
    mesh.castShadow = true;
    mesh.userData.grebbleHeight = height;
    return mesh;
  }

  function clearGrebbles(obj){
    const list = obj.mesh.userData.greebles;
    if (!list || !list.length) return;
    for (const g of list){
      obj.mesh.remove(g);
      g.geometry.dispose();
      g.material.dispose();
    }
    obj.mesh.userData.greebles = [];
  }

  function applyGrebble(obj, count){
    clearGrebbles(obj);
    obj.mesh.userData.greebles = [];
    obj.mesh.userData.grebbleCount = count;
    if (count <= 0) return;
    obj.mesh.updateMatrixWorld(true);
    const geo = obj.mesh.geometry;
    geo.computeBoundingSphere();
    const bs = geo.boundingSphere;
    if (!bs) return;
    const center = bs.center.clone();
    const R = bs.radius*3 + 2;

    const rc = new THREE.Raycaster();
    let placed = 0, attempts = 0;
    const maxAttempts = count*15;

    while (placed < count && attempts < maxAttempts){
      attempts++;
      const dir = new THREE.Vector3(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1).normalize();
      const originLocal = center.clone().add(dir.clone().multiplyScalar(R));
      const originWorld = obj.mesh.localToWorld(originLocal.clone());
      const targetWorld = obj.mesh.localToWorld(center.clone());
      const rayDir = targetWorld.clone().sub(originWorld).normalize();
      rc.set(originWorld, rayDir);
      rc.near = 0.001;
      rc.far = R*2.5;
      const hits = rc.intersectObject(obj.mesh, false);
      if (!hits.length || !hits[0].face) continue;
      const hit = hits[0];
      const localPoint = obj.mesh.worldToLocal(hit.point.clone());
      const localNormal = hit.face.normal.clone().normalize();

      const piece = buildGrebblePiece();
      const h = piece.userData.grebbleHeight;
      piece.position.copy(localPoint).add(localNormal.clone().multiplyScalar(h*0.42));
      const yAxis = new THREE.Vector3(0,1,0);
      const q = new THREE.Quaternion().setFromUnitVectors(yAxis, localNormal);
      piece.quaternion.copy(q);
      piece.rotateY((Math.random()-0.5)*Math.PI*2);

      obj.mesh.add(piece);
      obj.mesh.userData.greebles.push(piece);
      placed++;
    }
  }

  /* ============ IMPORT: DRAWING/IMAGE -> FIGURE ============ */
  function convexHull(points){
    const pts = points.slice().sort((a,b)=> a.x-b.x || a.y-b.y);
    const cross = (o,a,b) => (a.x-o.x)*(b.y-o.y) - (a.y-o.y)*(b.x-o.x);
    const lower = [];
    for (const p of pts){
      while (lower.length>=2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
      lower.push(p);
    }
    const upper = [];
    for (let i=pts.length-1;i>=0;i--){
      const p = pts[i];
      while (upper.length>=2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
      upper.push(p);
    }
    upper.pop(); lower.pop();
    return lower.concat(upper);
  }

  function extractMask(imgData, w, h){
    const d = imgData.data;
    const mask = new Uint8Array(w*h);
    let hasAlpha = false;
    for (let i=3;i<d.length;i+=4){ if (d[i] < 250){ hasAlpha=true; break; } }
    for (let i=0, p=0; i<d.length; i+=4, p++){
      if (hasAlpha){
        mask[p] = d[i+3] > 40 ? 1 : 0;
      } else {
        const lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        mask[p] = lum < 200 ? 1 : 0;
      }
    }
    return mask;
  }

  function spawnImportedFigure(hullPx){
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for (const p of hullPx){ if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; }
    const w = maxX-minX, h = maxY-minY;
    const target = 2.6;
    const s = target / Math.max(w,h,1);
    const cx = (minX+maxX)/2, cy=(minY+maxY)/2;

    const shapeGeom = new THREE.Shape();
    hullPx.forEach((p,i)=>{
      const sx=(p.x-cx)*s, sy=-(p.y-cy)*s;
      if (i===0) shapeGeom.moveTo(sx,sy); else shapeGeom.lineTo(sx,sy);
    });
    shapeGeom.closePath();

    const geo = new THREE.ExtrudeGeometry(shapeGeom, {depth:0.5, bevelEnabled:false, steps:1});
    geo.computeBoundingBox();
    const bb = geo.boundingBox;
    geo.translate(-(bb.min.x+bb.max.x)/2, -bb.min.y, -(bb.min.z+bb.max.z)/2);
    geo.computeVertexNormals();

    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0xd8a6ff, roughness:.5, metalness:.1}));
    mesh.castShadow = true;
    mesh.userData = {custom:true};
    mesh.position.set(0, 0, 0);

    scene.add(mesh);
    const obj = {mesh, type:'imported'};
    objects.push(obj);
    updateCount();
    setMode('select');
    select(obj);
    toast('Figura importada creada');
  }

  function importImageFile(file){
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const maxDim = 260;
      const scaleDown = Math.min(1, maxDim / Math.max(img.width, img.height));
      const cw = Math.max(1, Math.round(img.width*scaleDown));
      const ch = Math.max(1, Math.round(img.height*scaleDown));
      const c = document.createElement('canvas');
      c.width = cw; c.height = ch;
      const cctx = c.getContext('2d');
      cctx.drawImage(img, 0, 0, cw, ch);
      URL.revokeObjectURL(url);
      let imgData;
      try { imgData = cctx.getImageData(0,0,cw,ch); }
      catch(e){ toast('No se pudo leer la imagen'); return; }
      const mask = extractMask(imgData, cw, ch);
      const isFg = (x,y)=> x>=0&&y>=0&&x<cw&&y<ch && mask[y*cw+x]===1;
      const edgePts = [];
      for (let y=0;y<ch;y++){
        for (let x=0;x<cw;x++){
          if (!isFg(x,y)) continue;
          if (!isFg(x-1,y)||!isFg(x+1,y)||!isFg(x,y-1)||!isFg(x,y+1)) edgePts.push({x,y});
        }
      }
      if (edgePts.length < 8){ toast('No se detectó un dibujo claro en la imagen'); return; }
      const hull = convexHull(edgePts);
      if (hull.length < 3){ toast('No se pudo extraer un contorno de la imagen'); return; }
      spawnImportedFigure(hull);
    };
    img.onerror = () => toast('No se pudo cargar la imagen');
    img.src = url;
  }

  /* ============ IMPORT: OBJ / STL MODELS ============ */
  function parseOBJ(text){
    const verts = [];
    const positions = [];
    const lines = text.split('\n');
    for (const raw of lines){
      const line = raw.trim();
      if (!line || line[0]==='#') continue;
      const parts = line.split(/\s+/);
      const tag = parts[0];
      if (tag === 'v'){
        verts.push([parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])]);
      } else if (tag === 'f'){
        const idxs = parts.slice(1).map(tok=>{
          const rawIdx = tok.split('/')[0];
          let idx = parseInt(rawIdx, 10);
          if (idx < 0) idx = verts.length + idx + 1;
          return idx - 1;
        }).filter(i => i>=0 && i<verts.length);
        for (let i=1;i<idxs.length-1;i++){
          const a=verts[idxs[0]], b=verts[idxs[i]], c=verts[idxs[i+1]];
          positions.push(a[0],a[1],a[2], b[0],b[1],b[2], c[0],c[1],c[2]);
        }
      }
    }
    return positions.length ? new Float32Array(positions) : null;
  }

  function parseSTLAscii(text){
    const positions = [];
    const vertRe = /vertex\s+([\-\d.eE+]+)\s+([\-\d.eE+]+)\s+([\-\d.eE+]+)/g;
    let m;
    while ((m = vertRe.exec(text)) !== null){
      positions.push(parseFloat(m[1]), parseFloat(m[2]), parseFloat(m[3]));
    }
    return positions.length ? new Float32Array(positions) : null;
  }

  function parseSTLBinary(buffer){
    const dv = new DataView(buffer);
    if (buffer.byteLength < 84) return null;
    const triCount = dv.getUint32(80, true);
    if (triCount <= 0 || 84 + triCount*50 > buffer.byteLength + 2) return null;
    const positions = new Float32Array(triCount*9);
    let offset = 84, p = 0;
    for (let i=0;i<triCount;i++){
      offset += 12; // skip normal
      for (let v=0; v<3; v++){
        positions[p++] = dv.getFloat32(offset, true); offset+=4;
        positions[p++] = dv.getFloat32(offset, true); offset+=4;
        positions[p++] = dv.getFloat32(offset, true); offset+=4;
      }
      offset += 2; // attribute byte count
    }
    return positions;
  }

  function parseSTL(buffer){
    const head = new TextDecoder('utf-8').decode(new Uint8Array(buffer, 0, Math.min(512, buffer.byteLength)));
    if (/^\s*solid\b/i.test(head) && head.toLowerCase().includes('facet')){
      return parseSTLAscii(new TextDecoder('utf-8').decode(buffer));
    }
    return parseSTLBinary(buffer);
  }

  function addImportedGeometry(positions){
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.computeBoundingBox();
    const bb = geo.boundingBox;
    const size = new THREE.Vector3(); bb.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z, 0.0001);
    const target = 3.2;
    const scale = target / maxDim;
    const cx = (bb.min.x+bb.max.x)/2, cz = (bb.min.z+bb.max.z)/2;
    geo.translate(-cx, -bb.min.y, -cz);
    geo.scale(scale, scale, scale);
    geo.computeVertexNormals();

    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0xffd166, roughness:.45, metalness:.15}));
    mesh.castShadow = true;
    mesh.userData = {custom:true};
    const spawnPos = new THREE.Vector3(0,0,0);
    mesh.position.set(spawnPos.x, 0, spawnPos.z);
    scene.add(mesh);
    const obj = {mesh, type:'imported'};
    objects.push(obj);
    updateCount();
    setMode('select');
    select(obj);
    toast('Modelo 3D importado');
  }

  overlay.addEventListener('pointermove', (e)=>{
    if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if (activePointers.size >= 2){
      const pts = Array.from(activePointers.values());
      const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      const cx = (pts[0].x+pts[1].x)/2, cy = (pts[0].y+pts[1].y)/2;

      if (view === 'perspective'){
        const ang = Math.atan2(pts[1].y-pts[0].y, pts[1].x-pts[0].x);
        if (twoFingerPrev){
          const distRatio = d / (twoFingerPrev.d || d);
          radius = Math.max(4, Math.min(30, radius / distRatio));

          let dAng = ang - twoFingerPrev.ang;
          if (dAng > Math.PI) dAng -= Math.PI*2;
          if (dAng < -Math.PI) dAng += Math.PI*2;
          theta -= dAng;

          panCamera(cx - twoFingerPrev.cx, cy - twoFingerPrev.cy);
          updateCamera();
        }
        twoFingerPrev = {cx, cy, d, ang};
      } else if (view === 'top' || view === 'side'){
        // ortho views: pan + zoom only, no rotation
        if (twoFingerPrev){
          const distRatio = d / (twoFingerPrev.d || d);
          camOrtho.zoom = Math.max(0.4, Math.min(3, camOrtho.zoom*distRatio));
          camOrtho.updateProjectionMatrix();
          panOrtho(cx - twoFingerPrev.cx, cy - twoFingerPrev.cy);
        }
        twoFingerPrev = {cx, cy, d};
      } else if (pinchStartDist && pinchStartScale && selected){
        const factor = Math.max(0.25, Math.min(4.5, d/pinchStartDist));
        selected.mesh.scale.set(
          pinchStartScale.x*factor, pinchStartScale.y*factor, pinchStartScale.z*factor

      }
      return;
    }

    if (pressTimer && Math.hypot(e.clientX-pressStart.x, e.clientY-pressStart.y) > 6){
      clearTimeout(pressTimer);
      pressTimer = null;
    }

    if (orbiting){
      const dx = e.clientX-lastX, dy = e.clientY-lastY;
      theta -= dx*0.006;
      phi -= dy*0.006;
      lastX=e.clientX; lastY=e.clientY;

      const pts = topCurrent.points;

      drawSeg(pts[n-2], pts[n-1], '#7dd3fc');

        for (const kind of getMirrorKinds()){
          drawSeg(mirrorPoint(pts[n-2], kind), mirrorPoint(pts[n-1], kind), 'rgba(167,139,250,0.85)');
        }
      }
      return;
    }

    if (mode==='select' && dragging && selected){
      if (activeAxis){
        if (transformMode === 'move'){
          if (axisScreenPerUnit){
            const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
            const pxPerUnit = Math.hypot(axisScreenPerUnit.x, axisScreenPerUnit.y) || 1;
            const dirX = axisScreenPerUnit.x/pxPerUnit, dirY = axisScreenPerUnit.y/pxPerUnit;
            const scalarPx = dx*dirX + dy*dirY;
            selected.mesh.position[activeAxis] = axisDragStartValue + scalarPx/pxPerUnit;
          }
        } else if (transformMode === 'rotate'){
          const dx = e.clientX - dragStart.x;
          selected.mesh.rotation[activeAxis] = axisDragStartRot + dx*0.012;
        } else if (transformMode === 'scale'){
          const dx = e.clientX - dragStart.x;
          const factor = Math.max(0.15, Math.min(6, axisDragStartScale * Math.exp(dx*0.006)));
          selected.mesh.scale[activeAxis] = factor;
          applyRest(selected);
        }
      } else if (transformMode === 'move'){
        const p = screenToWorld(e.clientX, e.clientY);
        if (p){
          const [a1,a2] = freeAxesForView(view);
          selected.mesh.position[a1] = p[a1];
          selected.mesh.position[a2] = p[a2];
        }
      } else if (transformMode === 'rotate'){
        const dx = e.clientX - dragStart.x;
        selected.mesh.rotation[axisForView(view)] = initialRot + dx*0.012;
      } else if (transformMode === 'scale'){
        const dx = e.clientX - dragStart.x;
        const factor = Math.max(0.25, Math.min(4.5, initialScale * Math.exp(dx*0.006)));
        selected.mesh.scale.set(factor, factor, factor);
        applyRest(selected);
      }
    }
  });

  overlay.addEventListener('pointerup', (e)=>{
    activePointers.delete(e.pointerId);
    if (activePointers.size < 2){ pinchStartDist = null; pinchStartScale = null; twoFingerPrev = null; }
    clearTimeout(pressTimer);
    pressTimer = null;
    if (orbiting){ orbiting=false; return; }

    if (mode==='draw' && topCurrent){
      const pts = topCurrent.points;
      if (pts.length >= 3){
        topStrokes.push({points: pts, color: '#7dd3fc'});
        if (view !== 'perspective'){
          for (const kind of getMirrorKinds()){
            topStrokes.push({points: pts.map(p=>mirrorPoint(p,kind)), color: 'rgba(167,139,250,0.85)'});
          }
        }
      }
      topCurrent = null;
    }

    dragging = false;
  });

  overlay.addEventListener('pointercancel', (e)=>{
    activePointers.delete(e.pointerId);
    if (activePointers.size < 2){ pinchStartDist = null; pinchStartScale = null; twoFingerPrev = null; }
    orbiting=false; dragging=false;
    if (topCurrent){ topCurrent=null; redrawTopCanvas(); }
  });

  overlay.addEventListener('pointerleave', (e)=>{
    activePointers.delete(e.pointerId);
    if (activePointers.size < 2){ pinchStartDist = null; pinchStartScale = null; twoFingerPrev = null; }
    clearTimeout(pressTimer);
    pressTimer = null;
    orbiting=false; dragging=false;
    if (topCurrent){ topCurrent=null; redrawTopCanvas(); }
  });

  overlay.addEventListener('wheel', (e)=>{
    if (mode === 'select' && selected && e.ctrlKey){
      const factor = e.deltaY < 0 ? 1.06 : 0.94;
      const newScale = Math.max(0.25, Math.min(4.5, selected.mesh.scale.x*factor));
      selected.mesh.scale.set(newScale, newScale, newScale);
      applyRest(selected);
      e.preventDefault();
      return;
    }
    if (view === 'perspective'){
      radius += e.deltaY*0.012;
      updateCamera();
    } else {
      camOrtho.zoom = Math.max(0.4, Math.min(3, camOrtho.zoom - e.deltaY*0.001));
      camOrtho.updateProjectionMatrix();
    }
    e.preventDefault();
  }, {passive:false});

  } catch (err){
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:16px;z-index:99999;background:#1a0e10;color:#ff9d9d;'
      + 'border:1px solid #7a2b2b;border-radius:10px;padding:16px;font:12px monospace;'
      + 'white-space:pre-wrap;overflow:auto;max-height:80vh;';
    box.textContent = 'Error al iniciar la escena 3D:\n\n' + (err && err.stack ? err.stack : err);
    document.body.appendChild(box);
    console.error(err);
  }
})();
</script>
</body>
</html>
