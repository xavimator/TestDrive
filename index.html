<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen · Montaje y Postproducción Audiovisual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1013;
  --panel:#161A1F;
  --panel-2:#1D2229;
  --line: #2A3038;
  --teal:#20B2A6;
  --teal-dim: #14766D;
  --orange:#E8873A;
  --orange-dim:#B4632228;
  --text:#ECEAE4;
  --muted:#8A929D;
  --red:#E15B5B;
  --green:#3FC98A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 600px at 15% -10%, rgba(32,178,166,0.10), transparent 60%),
    radial-gradient(900px 500px at 105% 10%, rgba(232,135,58,0.09), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px;}

/* ---- Header / slate ---- */
.slate{
  display:flex;align-items:center;gap:14px;
  margin-bottom:22px;
}
.slate-chip{
  font-family:'Space Mono',monospace;
  font-size:11px;letter-spacing:.12em;
  color:var(--bg);
  background:var(--teal);
  padding:4px 9px;border-radius:3px;
  font-weight:700;
}
.slate-line{flex:1;height:1px;background:linear-gradient(90deg, var(--line), transparent);}
.timecode{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:.05em;}

h1.title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(38px,7vw,58px);
  letter-spacing:.01em;
  line-height:0.95;
  margin:6px 0 4px;
  color:var(--text);
}
h1.title span{color:var(--orange);}
.subtitle{color:var(--muted);font-size:15px;margin-bottom:26px;max-width:56ch;line-height:1.5;}

/* ---- scope dial decorative ---- */
.scopes{display:flex;gap:14px;margin:0 0 30px;}
.scope-wheel{
  width:64px;height:64px;border-radius:50%;
  background: conic-gradient(from 200deg, var(--teal), var(--panel-2) 30%, var(--panel-2) 65%, var(--orange));
  position:relative; flex:none;
  box-shadow: inset 0 0 0 1px var(--line), 0 8px 24px -12px rgba(0,0,0,.6);
}
.scope-wheel::after{
  content:'';position:absolute;inset:26%;border-radius:50%;
  background:var(--bg); box-shadow: inset 0 0 0 1px var(--line);
}
.scope-label{align-self:center;font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);line-height:1.5;}
.scope-label b{color:var(--text);display:block;font-size:13px;}

/* ---- cards / panels ---- */
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:24px;
}
.panel + .panel{margin-top:16px;}

/* ---- chapter select grid ---- */
.chgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px;}
@media(min-width:640px){.chgrid{grid-template-columns:1fr 1fr;}}
.chcard{
  display:flex; align-items:center; gap:14px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px 16px;
  cursor:pointer;
  text-align:left;
  transition: border-color .15s, transform .15s, background .15s;
  color:var(--text);
  font-family:'Inter',sans-serif;
  width:100%;
}
.chcard:hover{border-color:var(--teal); background:#1F262D; transform:translateY(-1px);}
.chcard:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
.chnum{
  font-family:'Space Mono',monospace;
  font-size:20px; font-weight:700; color:var(--orange);
  min-width:34px;
}
.chinfo{flex:1; min-width:0;}
.chinfo .ttl{font-size:14px;font-weight:600;line-height:1.3;}
.chinfo .meta{font-size:11.5px;color:var(--muted);margin-top:3px;font-family:'Space Mono',monospace;}
.chdone{color:var(--teal);font-family:'Space Mono',monospace;font-size:12px;font-weight:700;}

.startall{
  margin-top:18px; width:100%;
  background:var(--orange); color:#1A1005; border:none;
  font-family:'Inter',sans-serif; font-weight:700; font-size:15px;
  padding:14px 18px; border-radius:8px; cursor:pointer;
  transition: filter .15s, transform .15s;
}
.startall:hover{filter:brightness(1.08); transform:translateY(-1px);}

/* ---- timeline / progress ---- */
.timeline{
  position:relative; height:8px; border-radius:4px;
  background:var(--panel-2); overflow:hidden; margin:6px 0 4px;
  border:1px solid var(--line);
}
.timeline-fill{
  position:absolute; inset:0 auto 0 0; width:0%;
  background:linear-gradient(90deg, var(--teal), var(--orange));
  transition:width .3s ease;
}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.hud-left{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);}
.hud-left b{color:var(--text);}
.scorepill{
  font-family:'Space Mono',monospace;font-size:12px;
  background:var(--panel-2); border:1px solid var(--line);
  padding:4px 10px;border-radius:20px; color:var(--teal); font-weight:700;
}
.backlink{
  background:none;border:none;color:var(--muted);
  font-family:'Space Mono',monospace;font-size:12px;cursor:pointer;
  padding:6px 0; margin-bottom:14px; display:inline-flex; gap:6px; align-items:center;
}
.backlink:hover{color:var(--text);}

/* ---- question ---- */
.qeyebrow{
  font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.1em;
  color:var(--orange); margin-bottom:10px; text-transform:uppercase;
}
.qtext{font-size:19px; line-height:1.45; font-weight:600; margin-bottom:22px;}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{
  display:flex; align-items:flex-start; gap:12px;
  background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
  padding:13px 15px; cursor:pointer; text-align:left;
  font-family:'Inter',sans-serif; font-size:14.5px; color:var(--text);
  transition: border-color .12s, background .12s;
  width:100%;
}
.opt:hover:not(.locked){border-color:var(--teal);}
.opt:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
.opt .letter{
  font-family:'Space Mono',monospace; font-weight:700; font-size:12px;
  color:var(--muted); min-width:20px; padding-top:1px;
}
.opt.correct{border-color:var(--green); background:#123027;}
.opt.correct .letter{color:var(--green);}
.opt.wrong{border-color:var(--red); background:#301616;}
.opt.wrong .letter{color:var(--red);}
.opt.dim{opacity:.55;}

.feedback{
  margin-top:18px; padding:14px 16px; border-radius:8px;
  border:1px solid var(--line); background:var(--panel-2);
  font-size:14px; line-height:1.55; color:var(--muted);
  display:none;
}
.feedback.show{display:block;}
.feedback .tag{
  font-family:'Space Mono',monospace; font-weight:700; font-size:12px;
  letter-spacing:.05em; margin-bottom:6px; display:block;
}
.feedback.ok .tag{color:var(--green);}
.feedback.bad .tag{color:var(--red);}
.feedback b{color:var(--text);}

.navrow{display:flex; justify-content:flex-end; margin-top:20px;}
.nextbtn{
  background:var(--teal); color:#04211D; border:none;
  font-family:'Inter',sans-serif; font-weight:700; font-size:14.5px;
  padding:11px 22px; border-radius:8px; cursor:pointer;
  opacity:0; pointer-events:none; transition:opacity .2s, filter .15s;
}
.nextbtn.show{opacity:1; pointer-events:auto;}
.nextbtn:hover{filter:brightness(1.08);}

/* ---- results ---- */
.result-badge{
  font-family:'Bebas Neue',sans-serif; font-size:64px; color:var(--orange);
  line-height:1;
}
.result-sub{color:var(--muted); font-size:14px; margin-top:2px;}
.breakdown{margin-top:22px; display:flex; flex-direction:column; gap:8px;}
.brow{
  display:flex; align-items:center; gap:12px;
  font-family:'Space Mono',monospace; font-size:12.5px;
}
.brow .blabel{min-width:150px; color:var(--muted); flex:none;}
.btrack{flex:1; height:7px; border-radius:4px; background:var(--panel-2); border:1px solid var(--line); overflow:hidden;}
.bfill{height:100%; background:linear-gradient(90deg,var(--teal),var(--orange));}
.bscore{min-width:44px; text-align:right; color:var(--text);}

.resultbtns{display:flex; gap:10px; margin-top:24px; flex-wrap:wrap;}
.resultbtns button{
  font-family:'Inter',sans-serif; font-weight:700; font-size:14px;
  padding:11px 18px; border-radius:8px; cursor:pointer; border:1px solid var(--line);
}
.btn-primary{background:var(--orange); color:#1A1005; border:none;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-secondary{background:transparent; color:var(--text);}
.btn-secondary:hover{border-color:var(--teal);}

footer.credit{
  text-align:center; color:var(--muted); font-size:11.5px;
  font-family:'Space Mono',monospace; margin-top:40px; letter-spacing:.03em;
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const CH_TITLES = {
  1:"Introducción al montaje audiovisual",
  2:"Planificación del montaje audiovisual",
  3:"Recepción del material, gestión de datos e ingesta",
  4:"Organización del material y sincronización",
  5:"El montaje Offline: construcción narrativa",
  6:"Efectos Visuales (VFX) y preparación",
  7:"Conformado (Online Editing) y Digital Intermediate",
  8:"Corrección de color y etalonaje profesional",
  9:"Postproducción de sonido",
  10:"Control de Calidad (QC) y Máster de Distribución"
};

const QUESTIONS = 
[{"ch":1,"q":"¿Qué es, según el manual, el montaje audiovisual?","opts":["El proceso de organizar y combinar fragmentos aislados para construir una narración con sentido dramático, emocional y visual","El proceso de grabar varias tomas de una misma escena","La técnica de iluminar correctamente un plano","El proceso de escribir el guion literario"],"correct":0,"why":"El montaje transforma fragmentos independientes en una narración continua con sentido dramático, emocional y visual."},{"ch":1,"q":"Según el manual, ¿cuántas veces se dice que se escribe una película?","opts":["Una sola vez, durante el guion","Dos veces: guion y rodaje","Tres veces: guion, rodaje y montaje","Cuatro veces, incluyendo la distribución"],"correct":2,"why":"Se dice que una película se escribe durante el guion, durante el rodaje y durante el montaje."},{"ch":1,"q":"¿Cuál de las siguientes NO es una de las funciones del montaje descritas en el capítulo 1?","opts":["Función narrativa","Función emocional","Función estética","Función publicitaria"],"correct":3,"why":"El manual describe las funciones narrativa, emocional, estética y expresiva; la 'función publicitaria' no aparece."},{"ch":1,"q":"La función narrativa del montaje se caracteriza principalmente porque:","opts":["Puede modificar completamente el orden temporal de los acontecimientos","Determina únicamente la resolución de imagen","Se ocupa solo de la corrección de color","Sustituye al guion técnico"],"correct":0,"why":"El montaje organiza los acontecimientos y puede alterar completamente el orden temporal (flashbacks, flashforwards, etc.)."},{"ch":1,"q":"Según el ejemplo del manual, un mismo plano de 10 segundos transmite calma, mientras que reducido a 2 segundos transmite:","opts":["Sensación de urgencia","Sensación de nostalgia","Sensación de humor","Ninguna diferencia perceptible"],"correct":0,"why":"Ese es el ejemplo de la función emocional: la duración del plano puede cambiar la sensación de calma a urgencia."},{"ch":1,"q":"¿Cuál de estos es un ejemplo de estilo visual mencionado en la función estética del montaje?","opts":["Montaje invisible","Montaje sonoro","Montaje de checksum","Montaje de metadatos"],"correct":0,"why":"Entre los ejemplos citados están montaje clásico, videoclip, documental, experimental, invisible e hiperactivo."},{"ch":1,"q":"El ejemplo del niño que sonríe y el perro que corre, interpretado por el espectador como relacionado aunque se grabaran en días distintos, ilustra:","opts":["La función expresiva del montaje","La regla de los 180 grados","El proceso de checksum","El control de calidad"],"correct":0,"why":"Ese ejemplo ilustra la función expresiva: el montaje puede transmitir ideas que nunca fueron filmadas juntas."},{"ch":1,"q":"Durante los primeros años del cine, los hermanos Lumière:","opts":["Utilizaban un único plano fijo sin ningún corte","Inventaron el montaje paralelo","Fueron los primeros en usar el chroma key","Desarrollaron la regla de los 180 grados"],"correct":0,"why":"Los Lumière colocaban la cámara frente a una escena y registraban toda la acción en un único plano fijo, sin cortes."},{"ch":1,"q":"¿Qué director demostró con 'Asalto y robo de un tren' (1903) que una narración podía construirse uniendo escenas de lugares y momentos diferentes?","opts":["Edwin S. Porter","D. W. Griffith","Lev Kuleshov","Serguéi Eisenstein"],"correct":0,"why":"Edwin S. Porter fue uno de los primeros en usar varios planos para construir una historia en esa película."},{"ch":1,"q":"¿Qué cineasta introdujo los primeros planos, planos generales, el montaje paralelo y la continuidad espacial?","opts":["D. W. Griffith","Edwin S. Porter","Lev Kuleshov","Serguéi Eisenstein"],"correct":0,"why":"D. W. Griffith perfeccionó el lenguaje cinematográfico introduciendo estos elementos."},{"ch":1,"q":"En el experimento de Lev Kuleshov, la misma fotografía de un actor se alternaba con un plato de sopa, un ataúd y una niña jugando. ¿Qué demostró este experimento?","opts":["Que el significado nace de la unión entre dos imágenes, no del propio plano","Que el sonido es más importante que la imagen","Que el raccord de mirada es innecesario","Que el eje de acción debe respetarse siempre"],"correct":0,"why":"El rostro del actor nunca cambiaba; el significado (hambre, tristeza, alegría) nacía únicamente de la combinación de imágenes: el Efecto Kuleshov."},{"ch":1,"q":"¿Cómo se llama el fenómeno descrito en la pregunta anterior?","opts":["Efecto Kuleshov","Efecto Griffith","Montaje de atracciones","Raccord narrativo"],"correct":0,"why":"Este fenómeno recibe el nombre de Efecto Kuleshov."},{"ch":1,"q":"Serguéi Eisenstein defendía que el verdadero significado del montaje se encuentra en:","opts":["El choque entre dos planos diferentes","La duración exacta de cada plano","El uso de la claqueta","La calidad del sonido directo"],"correct":0,"why":"Eisenstein llamó a esta teoría 'montaje de atracciones': el significado nace del choque entre dos planos."},{"ch":1,"q":"La escalinata de Odesa, secuencia estudiada en todas las escuelas de cine, pertenece a la película:","opts":["El acorazado Potemkin","Asalto y robo de un tren","Nacimiento de una nación","Metrópolis"],"correct":0,"why":"La escalinata de Odesa es una secuencia célebre de El acorazado Potemkin, de Eisenstein."},{"ch":1,"q":"Según el manual, el montaje es el equivalente audiovisual de:","opts":["La gramática de un idioma","La banda sonora de una película","El guion literario","La iluminación del rodaje"],"correct":0,"why":"El manual compara el montaje con la gramática: los planos serían las palabras y sus relaciones, las reglas gramaticales."},{"ch":1,"q":"¿Cuál de estas ideas describe correctamente el trabajo real de un montador según el capítulo 1?","opts":["Su trabajo consiste únicamente en eliminar los errores del rodaje","Debe tomar cientos o miles de decisiones, como elegir interpretaciones, mantener el raccord y controlar el ritmo","Solo se dedica a la corrección de color","No colabora con el director"],"correct":1,"why":"El manual aclara que existe la idea equivocada de que el editor solo elimina errores; en realidad toma numerosas decisiones creativas y técnicas."},{"ch":1,"q":"Además del montaje narrativo, ¿en qué tareas de postproducción suele participar hoy el editor?","opts":["Integración de VFX, montaje multicámara, grafismo y preparación para color y sonido","Únicamente en el rodaje de las escenas","Solo en la contratación de actores","Solo en la promoción del filme"],"correct":0,"why":"El manual indica que el editor moderno también participa en VFX, multicámara, grafismo, preparación para color y sonido, conformado y QC."},{"ch":1,"q":"En el flujo profesional de postproducción descrito en el capítulo 1, ¿qué etapa sigue inmediatamente después del Rodaje?","opts":["DIT","Picture Lock","Corrección de Color","Máster"],"correct":0,"why":"El flujo descrito es: Guion técnico → Rodaje → DIT → Recepción del material → ... hasta Distribución."},{"ch":1,"q":"¿Qué unidades de competencia se mencionan como base del flujo descrito en el capítulo 1?","opts":["UC0947, UC0948, UC0949 y UC0919","UC1001, UC1002 y UC1003","ISO9001 y ISO14001","UC0001 y UC0002"],"correct":0,"why":"El manual señala que el flujo descrito abarca las competencias UC0947, UC0948, UC0949 y UC0919."},{"ch":1,"q":"Según el capítulo 1, el editor moderno necesita conocimientos técnicos en, entre otros:","opts":["Códecs de vídeo, formatos de audio, espacios de color y gestión de metadatos","Solo interpretación actoral","Solo dirección de fotografía","Solo composición musical"],"correct":0,"why":"El manual lista códecs, formatos de audio, espacios de color, metadatos, timecode, almacenamiento, proxies, HDR, VFX e intercambio de archivos, entre otros."},{"ch":2,"q":"Según el capítulo 2, ¿cuándo comienza realmente el trabajo del departamento de montaje en una producción profesional?","opts":["Mucho antes de importar el primer archivo de vídeo, incluso durante el rodaje","Solo después de finalizar todo el rodaje","Solo tras la corrección de color","Solo cuando lo solicita el distribuidor"],"correct":0,"why":"El montaje profesional comienza mucho antes de importar el primer archivo, mientras el equipo aún está rodando."},{"ch":2,"q":"¿Cuáles son las cuatro preguntas fundamentales a las que responde la planificación, según el manual?","opts":["Qué historia contar, con qué medios técnicos, quién realiza cada proceso y cómo llegará al máster final","Cuánto cuesta, cuánto dura, quién dirige y quién produce","Qué cámara usar, qué lente usar, qué micrófono usar y qué luz usar","Qué actores contratar, qué localización usar, qué vestuario usar y qué maquillaje usar"],"correct":0,"why":"La planificación responde a: qué historia, con qué medios, quién realiza cada proceso y cómo se llega al máster final."},{"ch":2,"q":"El guion literario se diferencia del guion técnico porque:","opts":["El guion literario describe la historia sin información técnica de cámara; el técnico ya incluye tipo de plano, movimiento y duración","El guion literario incluye el timecode de cada toma","El guion técnico no incluye diálogos","Son exactamente el mismo documento"],"correct":0,"why":"El guion literario no aporta información técnica; el guion técnico traduce la historia a decisiones como tipo de plano, movimiento de cámara, duración, sonido, etc."},{"ch":2,"q":"La escaleta es el documento que:","opts":["Resume la estructura completa del programa o película","Detalla los ajustes de cámara de cada toma","Registra los checksums de los archivos","Contiene los diálogos exactos de cada escena"],"correct":0,"why":"La escaleta resume la estructura completa: introducción, presentación, conflicto, desarrollo, clímax y final."},{"ch":2,"q":"¿Para qué resulta especialmente útil el storyboard al montador?","opts":["Para prever continuidad, dirección de miradas, eje de acción y posibles transiciones","Para calcular el presupuesto de VFX","Para definir la frecuencia de muestreo del audio","Para elegir el software de montaje"],"correct":0,"why":"El storyboard, como representación gráfica del guion, permite al montador anticipar continuidad, miradas, eje de acción y transiciones."},{"ch":2,"q":"El parte de script, elaborado durante el rodaje, incluye principalmente:","opts":["Tomas buenas, tomas malas, incidencias y observaciones del director","Los ajustes de ISO y objetivo de cada cámara","La lista de efectos visuales necesarios","El presupuesto final de la producción"],"correct":0,"why":"La script supervisa la continuidad y documenta tomas buenas, malas, incidencias y observaciones del director."},{"ch":2,"q":"El parte de sonido incluye datos como:","opts":["Nombre de archivo WAV, escena, toma, frecuencia de muestreo y profundidad de bits","El storyboard de cada escena","La lista de VFX pendientes","El presupuesto de postproducción"],"correct":0,"why":"El parte de sonido documenta el archivo WAV, escena, toma, frecuencia de muestreo, profundidad de bits y observaciones del técnico."},{"ch":2,"q":"¿Quiénes suelen participar en la reunión de postproducción previa al inicio del montaje?","opts":["Director, productor, supervisor de postproducción, montador, supervisor de VFX, colorista y responsable de sonido","Únicamente el montador y el productor","Solo el equipo de cámara","Solo el distribuidor"],"correct":0,"why":"El manual enumera estos siete perfiles como participantes habituales en la reunión de postproducción."},{"ch":2,"q":"El pipeline, según el capítulo 2, se define como:","opts":["El recorrido que seguirá el proyecto desde el rodaje hasta el máster","El listado de actores confirmados","La lista de efectos de sonido disponibles","El presupuesto asignado a VFX"],"correct":0,"why":"El pipeline es el recorrido completo del proyecto: rodaje, descarga, backup, proxy, montaje, VFX, online, color, sonido, QC, máster y distribución."},{"ch":2,"q":"En el ejemplo del capítulo 2, la película se rueda en ARRIRAW 4.5K pero se edita en:","opts":["ProRes Proxy HD","REDCODE RAW 8K","DCP 2K","Betacam SP"],"correct":0,"why":"El formato de grabación puede diferir del de edición: se rueda en ARRIRAW 4.5K y se edita en ProRes Proxy HD, reenlazando después al original."},{"ch":2,"q":"¿Qué software se describe como el estándar tradicional para cine, televisión y grandes series, destacando por su estabilidad y trabajo colaborativo?","opts":["Avid Media Composer","Adobe Premiere Pro","DaVinci Resolve","Final Cut Pro"],"correct":0,"why":"Avid Media Composer es descrito como el estándar tradicional para cine, televisión y grandes series."},{"ch":2,"q":"¿Qué ventaja principal se atribuye a Adobe Premiere Pro?","opts":["Su integración con After Effects, Photoshop y Audition","Ser exclusivamente un software de corrección de color","Incluir Fusion y Fairlight de forma nativa","Ser el único compatible con formatos RAW"],"correct":0,"why":"El manual destaca la integración de Premiere Pro con After Effects, Photoshop y Audition."},{"ch":2,"q":"DaVinci Resolve, según el manual, era inicialmente un software:","opts":["Exclusivo de corrección de color","Exclusivo de edición de sonido","Exclusivo de motion graphics","Exclusivo de gestión de metadatos"],"correct":0,"why":"El manual indica que Resolve era inicialmente un software exclusivo de corrección de color y ahora incorpora montaje, color, Fusion y Fairlight."},{"ch":2,"q":"¿Qué sistema de almacenamiento es descrito como ideal para pequeños estudios, con un único ordenador conectado directamente al disco?","opts":["DAS (Direct Attached Storage)","NAS (Network Attached Storage)","SAN (Storage Area Network)","LTO"],"correct":0,"why":"El DAS es un único ordenador conectado directamente al disco, ideal para pequeños estudios."},{"ch":2,"q":"¿Qué sistema de almacenamiento permite que numerosos editores trabajen simultáneamente con archivos de muy alta resolución en grandes estudios?","opts":["SAN (Storage Area Network)","DAS (Direct Attached Storage)","Un disco duro externo USB","Una tarjeta SDXC"],"correct":0," ":["08_EXPORT","01_CAMERA","05_GFX","10_ARCHIVE"],"correct":0,"why":"En la estructura de ejemplo, 08_EXPORT corresponde a las exportaciones, mientras que 10_ARCHIVE es para el archivado."},{"ch":3,"q":"¿Qué figura profesional actúa como enlace entre el rodaje y la postproducción, descargando tarjetas y generando proxies?","opts":["El DIT (Digital Imaging Technician)","El Assistant Editor","El colorista","El mezclador de sonido"],"correct":0,"why":"El DIT es descrito como la figura que enlaza el rodaje con la postproducción, descargando tarjetas, verificando copias y generando proxies, entre otras tareas."},{"ch":3,"q":"¿Cuál de estos soportes NO se menciona entre los soportes actuales de recepción del material?","opts":["CFexpress","RED Mini-Mag","Codex Drive","Casete VHS"],"correct":3,"why":"El manual cita CFexpress, CFast, SDXC, RED Mini-Mag, Codex Drive, SSD, NVMe y RAID; el VHS no aparece entre los soportes actuales."},{"ch":3,"q":"¿Qué documento técnico, entre otros, acompaña al material recibido según el capítulo 3?","opts":["El CDL (Color Decision List)","El contrato de los actores","La factura de producción","El plan de rodaje del director de casting"],"correct":0,"why":"Entre la documentación que acompaña al material se citan guion técnico, storyboard, escaleta, partes de script y cámara, LUT y CDL, entre otros."},{"ch":3,"q":"Según la regla 3-2-1 de copias de seguridad, se deben mantener:","opts":["Tres copias, en dos soportes distintos, con una copia fuera del estudio","Dos copias en el mismo disco duro","Una única copia protegida con contraseña","Cuatro copias en la nube exclusivamente"],"correct":0,"why":"La regla 3-2-1 establece tres copias, dos soportes distintos y una copia fuera del estudio."},{"ch":3,"q":"¿Qué algoritmo NO se menciona entre los utilizados para verificar checksum en el capítulo 3?","opts":["MD5","SHA-256","xxHash","AES-256"],"correct":3,"why":"El manual cita MD5, SHA-1, SHA-256, xxHash y CRC32; AES-256 es un algoritmo de cifrado, no s descritas son Import, Link y Transcode; Render no se menciona como forma de ingesta."},{"ch":3,"q":"En la ingesta por 'Link', el software:","opts":["Crea simplemente un enlace, y el archivo permanece donde estaba","Copia físicamente el archivo dentro del proyecto","Genera un nuevo archivo optimizado","Elimina el archivo original"],"correct":0,"why":"En el modo Link, el software solo crea un enlace; el archivo original permanece en su ubicación."},{"ch":3,"q":"Un Proxy es, según el manual:","opts":["Una copia ligera del archivo original, suficiente para tomar decisiones narrativas","El archivo original sin comprimir","Un tipo de checksum","Un formato de subtítulos"],"correct":0,"why":"El proxy es una copia ligera (por ejemplo, ProRes Proxy 1920x1080) que sustituye temporalmente al original pesado durante el montaje."},{"ch":3,"q":"En el ejemplo del capítulo 3, un archivo original REDCODE RAW de 600 GB se convierte en un proxy ProRes Proxy de:","opts":["35 GB","600 GB","5 GB","1 TB"],"correct":0,"why":"El ejemplo indica que el proxy en 1920x1080 ProRes Proxy ocupa 35 GB frente a los 600 GB del original."},{"ch":3,"q":"Durante la ingesta, si el espacio de color no se interpreta correctamente al pasar de LogC a Rec709 mediante una LUT, la imagen puede aparecer:","opts":["Muy lavada, con poco contraste o con colores incorrectos","Con exceso de nitidez","Con canales de audio invertidos","Con el timecode duplicado"],"correct":0,"why":"Si el espacio de color no se gestiona correctamente, la imagen puede verse lavada, con poco contraste o colores incorrectos."},{"ch":3,"q":"El formato habitual de audio durante la ingesta, según el capítulo 3, es:","opts":["WAV, 48 kHz, 24 bits, PCM","MP3, 44.1 kHz, 16 bits","AAC, 48 kHz, 32 bits","FLAC, 96 kHz, 8 bits"],"correct":0,"why":"El manual indica que el formato habitual de audio en la ingesta es WAV, 48 kHz, 24 bits, PCM."},{"ch":3,"q":"¿Qué elemento organizativo, además de carpetas y etiquetas, se menciona para organizar los medi Montar utilizando copias optimizadas (proxies) en lugar de los originales de máxima calidad","Montar sin conexión a internet","Montar exclusivamente en formato analógico","Montar sin utilizar ningún software profesional"],"correct":0,"why":"El manual aclara que muchos estudiantes creen erróneamente que 'offline' significa sin internet; en realidad se refiere a montar con proxies en vez de los originales."},{"ch":5,"q":"Durante el montaje offline, ¿qué aspectos NO importan todavía según el capítulo 5?","opts":["La corrección de color, los efectos finales y el sonido definitivo","La mejor toma y el ritmo narrativo","Dónde debe empezar y terminar el plano","Qué información necesita el espectador"],"correct":0,"why":"El manual indica que durante el offline aún no importan la corrección de color, los efectos finales ni el sonido definitivo."},{"ch":5,"q":"El primer montaje completo de una película, que sigue el orden del guion pero aún dura demasiado y tiene errores, se llama:","opts":["Assembly Cut","Picture Lock","Director's Cut","Producer's Cut"],"correct":0,"why":"El Assembly Cut es el primer montaje, que coloca todas las escenas en el orden del guion, sin pulir aún."},{"ch":5,"q":"¿Cuál de estos NO es uno de los criterios habituales para seleccionar tomas según el capítulo 5?","opts":["Calidad interpretativa","Calidad técnica","Continuidad","Frecuencia de muestreo del audio"],"correct":3,"why":"Los criterios citados son calidad interpretativa, calidad técnica, continuidad e intención del director; la frecuencia de muestreo no es un criterio narrativo."},{"ch":5,"q":"¿Qué tipo de plano se describe como el que 'dirige la atención hacia un detalle psicológico'?","opts":["Primerísimo Primer Plano","Gran Plano General","Plano Americano","Plano Detalle"],"correct":0,"why":"El Primerísimo Primer Plano dirige la atención hacia un detalle psicológico del personaje, según el manual."},{"ch":5,"q":"¿Qué tipo de plano muestra la interacción entre personajes, encuadrando aproximadamente de la cabeza a la rodilla?","opts":["Plano Americano","Gran Plano General","Plano Detalle","Primer Plano"],"correct":0,"why":"El manual describe el Plano Americano como el que muestra la interacción entre personajes."},{"ch":5,"q":"Según el ejemplo del capítulo 5, un mismo plano de 12 segundos transmite calma y reflexión, mientras que reducido a 2 segundos transmite:","opts":["Urgencia, acción y tensión","Nostalgia y melancolía","Humor y ligereza","Ninguna diferencia"],"correct":0,"why":"El manual reutiliza este contraste (versión A de 12s frente a versión B de 2s) para ilustrar cómo la duración modifica la emoción."},{"ch":5,"q":"¿De qué depende el ritmo de una película además de la velocidad de los cortes?","opts":["Del movimiento interno del plano, el diálogo, la música y la duración de los silencios","Únicamente de la resolución de imagen","Únicamente del formato de entrega","Únicamente del espacio de color utilizado"],"correct":0,"why":"El manual explica que el ritmo depende también del movimiento interno, el diálogo, la música, la interpretación, la cámara y los silencios."},{"ch":5,"q":"El raccord es:","opts":["La continuidad entre dos planos consecutivos","El formato de exportación final del máster","El proceso de sincronización de sonido mediante claqueta","La técnica de eliminar el fondo verde"],"correct":0,"why":"El raccord se define como la continuidad entre dos planos consecutivos."},{"ch":5,"q":"Si un personaje comienza a levantarse en un plano y en el siguiente ya aparece de pie sin continuar el movimiento, se ha producido un fallo de:","opts":["Raccord de movimiento","Raccord de vestuario","Raccord de iluminación","Raccord de sonido"],"correct":0,"why":"El raccord de movimiento exige que la acción continúe exactamente entre planos consecutivos."},{"ch":5,"q":"El eje de acción, también llamado regla de los 180°, establece que:","opts":["La cámara debe permanecer siempre en el mismo lado de un eje imaginario entre personajes","Los planos deben durar siempre 180 segundos","El sonido debe grabarse siempre a 180 grados de ángulo","El montaje debe tener siempre 180 cortes por escena"],"correct":0,"why":"Existe un eje imaginario entre los personajes y la cámara debe mantenerse en el mismo lado para no confundir al espectador."},{"ch":5,"q":"¿Qué ocurre si la cámara cruza el eje de acción sin justificación narrativa?","opts":["El espectador pierde la orientación espacial","El sonido se desincroniza automáticamente","El proxy deja de funcionar","El checksum del archivo cambia"],"correct":0,"why":"Cruzar el eje de acción provoca que el espectador pierda la orientación espacial de la escena."},{"ch":5,"q":"¿Qué tipo de montaje presenta dos acciones que ocurren simultáneamente hasta converger, como policía y ladrón?","opts":["Montaje paralelo","Montaje acelerado","Montaje lento","Montaje intelectual"],"correct":0,"why":"El montaje paralelo alterna dos acciones simultáneas hasta que ambas historias convergen."},{"ch":5,"q":"El montaje intelectual, desarrollado por Eisenstein, se caracteriza porque:","opts":["El significado nace de la relación entre dos imágenes, sin necesidad de diálogo","Utiliza siempre planos muy cortos y acelerados","Se basa exclusivamente en fundidos encadenados","Requiere obligatoriamente sonido directo"],"correct":0,"why":"En el montaje intelectual, la yuxtaposición de imágenes (como un niño jugando y un soldado marchando) crea una idea nueva."},{"ch":5,"q":"¿Cuál de estas transiciones suele indicar el final de una secuencia?","opts":["Fundido a negro","Corte directo","Cortinilla","Desenfoque"],"correct":0,"why":"El fundido a negro suele emplearse para señalar el final de una secuencia."},{"ch":5,"q":"Durante el montaje offline, ¿qué tipo de sonido se utiliza para ayudar al director a valorar el ritmo antes de la mezcla definitiva?","opts":["Música temporal (temp music) y efectos provisionales","La mezcla final en Dolby Atmos","Únicamente silencio total","El máster de audio ya aprobado"],"correct":0,"why":"El manual explica que se usan música temporal, efectos provisionales, ambientes de referencia y diálogos sincronizados como sonido provisional."},{"ch":5,"q":"Ordena conceptualmente: ¿cuál de estas versiones del montaje suele aparecer ANTES en el proceso descrito en 5.13?","opts":["Assembly Cut","Director's Cut","Producer's Cut","Picture Lock"],"correct":0,"why":"El orden descrito es Assembly Cut → Editor's Cut → Director's Cut → Producer's Cut → Picture Lock."},{"ch":5,"q":"El Picture Lock es el momento en el que:","opts":["El director aprueba definitivamente la estructura y ya no se modifican duraciones ni orden de los planos","Se genera automáticamente el máster de distribución","Se eliminan todos los proxies del proyecto","Comienza el rodaje de las escenas adicionales"],"correct":0,"why":"El Picture Lock es la aprobación final de la estructura; a partir de ahí no se cambian duraciones, escenas ni el orden del montaje."},{"ch":5,"q":"¿Qué consecuencia tiene modificar un solo fotograma después del Picture Lock, según el manual?","opts":["Habrá que rehacer color, VFX, subtítulos, mezcla y conformado","No tiene ninguna consecuencia relevante","Solo afecta al departamento de sonido","Solo afecta a la duración total del proyecto"],"correct":0,"why":"El manual advierte que cambiar un fotograma tras el Picture Lock obliga a rehacer color, VFX, subtítulos, mezcla y conformado."},{"ch":5,"q":"Según las buenas prácticas del editor (5.15), el mejor montaje es aquel:","opts":["Cuyos cortes pasan desapercibidos para el espectador","Que contiene el mayor número posible de efectos","Que utiliza siempre el eje de acción de forma cruzada","Que dura el máximo tiempo posible"],"correct":0,"why":"El manual concluye que el mejor montaje es aquel cuyos cortes pasan desapercibidos para el espectador."},{"ch":6,"q":"¿En qué consiste principalmente el trabajo del editor respecto a los VFX, según el capítulo 6?","opts":["Identificar qué planos los necesitan, prepararlos, coordinarlos con VFX e integrarlos al volver","Crear personalmente todos los efectos visuales","Sustituir completamente al compositor","Renderizar toda la película en formato EXR"],"correct":0,"why":"El editor no crea los efectos; identifica los planos necesarios, los prepara, coordina con VFX y reintegra los resultados."},{"ch":6,"q":"¿Cuál es la diferencia principal entre SFX y VFX según el manual?","opts":["Los SFX se realizan durante el rodaje; los VFX se realizan después, de forma digital","Los SFX son siempre digitales y los VFX siempre físicos","No existe ninguna diferencia entre ambos","Los VFX solo se usan en publicidad"],"correct":0,"why":"Special Effects (SFX) se hacen durante el rodaje (explosiones reales, lluvia, maquillaje); Visual Effects (VFX) se generan después digitalmente."},{"ch":6,"q":"¿Cuál de estos es un ejemplo de SFX (Special Effects) según el capítulo 6?","opts":["Maquillaje prostético","Ciudades digitales","Chroma","Multitudes generadas por ordenador"],"correct":0,"why":"El maquillaje prostético se realiza físicamente durante el rodaje, por lo que es un SFX, no un VFX."},{"ch":6,"q":"El flujo de trabajo entre montaje y VFX comienza, según el capítulo 6, una vez alcanzado:","opts":["El Picture Lock","El Assembly Cut","El QC final","El máster mezzanine"],"correct":0,"why":"El editor prepara los planos VFX una vez alcanzado el Picture Lock, cuando la estructura narrativa ya está aprobada."},{"ch":6,"q":"El documento donde el editor lista todos los planos que requieren intervención de VFX se llama:","opts":["VFX Pull List","Parte de script","Checklist de QC","EDL"],"correct":0,"why":"La 'lista de planos VFX' o VFX Pull List recoge cada plano, su descripción y el departamento responsable."},{"ch":6,"q":"Al exportar los planos para VFX, además del plano útil se incluyen normalmente:","opts":["Handles (fotogramas adicionales antes y después)","Subtítulos definitivos","La mezcla final de sonido","El certificado de color del máster"],"correct":0,"why":"Se incluyen handles, por ejemplo +12 fotogramas delante y detrás, para dar margen de ajuste al compositor."},{"ch":6,"q":"¿Cuál es el formato de intercambio de VFX considerado estándar profesional, con 16/32 bits flotantes, HDR y canal alfa?","opts":["OpenEXR (.exr)","MP3","H.264","JPEG"],"correct":0,"why":"OpenEXR es descrito como el estándar profesional para VFX, con alta profundidad de bits, HDR, canal alfa y múltiples capas."},{"ch":6,"q":"El formato DPX se describe en el manual como:","opts":["Un formato tradicional de la industria cinematográfica, usado en escaneado y laboratorios digitales","Un formato exclusivo para redes sociales","Un códec de audio sin pérdidas","Un formato de subtítulos"],"correct":0,"why":"DPX es el formato tradicional de la industria del cine, muy utilizado en escaneado de película y laboratorios digitales."},{"ch":6,"q":"¿Cuál es una ventaja de exportar una secuencia de imágenes (por ejemplo, .exr numerados) en lugar de un único vídeo para VFX?","opts":["Si un fotograma falla, solo hay que volver a renderizar ese fotograma, no todo el vídeo","Ocupa mucho menos espacio en disco siempre","Elimina la necesidad de handles","Sustituye automáticamente al checksum"],"correct":0,"why":"El manual destaca que con secuencias de imágenes, un fallo puntual solo obliga a rerenderizar ese fotograma, aportando mayor seguridad."},{"ch":6,"q":"El canal Alfa almacena información sobre:","opts":["La transparencia de cada píxel","La saturación del color","El nivel de audio del plano","La resolución final del máster"],"correct":0,"why":"El canal alfa indica si un píxel es opaco, parcialmente transparente o totalmente transparente, y permite integrar objetos 3D sobre imágenes reales."},{"ch":6,"q":"El Chroma Key consiste en:","opts":["Filmar un sujeto delante de un fondo uniforme (habitualmente verde o azul) para eliminarlo digitalmente después","Dibujar máscaras manualmente fotograma a fotograma","Reconstruir el movimiento de la cámara en 3D","Capturar los movimientos de un actor mediante sensores"],"correct":0,"why":"El chroma consiste en filmar frente a un fondo uniforme, normalmente verde o azul, para eliminarlo posteriormente mediante 'key'."},{"ch":6,"q":"¿Qué factores afectan a la calidad de un chroma según el capítulo 6?","opts":["Iluminación uniforme, fondo sin arrugas, separación actor-pantalla y ausencia de sombras","Únicamente el color exacto del fondo verde","Únicamente la resolución de la cámara","Únicamente el software de composición utilizado"],"correct":0,"why":"El manual señala estos cuatro factores como determinantes de la calidad de un chroma key."},{"ch":6,"q":"La rotoscopia se define como:","opts":["Dibujar máscaras manualmente fotograma a fotograma cuando no existe chroma","Sustituir automáticamente el fondo verde por otro fondo","Un tipo de checksum utilizado en VFX","Un formato de exportación de audio"],"correct":0,"why":"La rotoscopia consiste en recortar manualmente el objeto, dibujando una máscara en cada fotograma, cuando no hay chroma."},{"ch":6,"q":"El Tracking 3D, también llamado Matchmoving, se utiliza para:","opts":["Reconstruir completamente el movimiento de la cámara e integrar objetos 3D con perspectiva correcta","Sincronizar el audio con la imagen","Detectar el checksum de un archivo","Generar subtítulos automáticamente"],"correct":0,"why":"El matchmoving (tracking 3D) reconstruye el movimiento de cámara para poder añadir objetos tridimensionales con la perspectiva correcta."},{"ch":6,"q":"El Motion Capture consiste en:","opts":["Transferir los movimientos de un actor con marcadores a un personaje digital","Filmar frente a un fondo verde","Dibujar manualmente cada fotograma","Sincronizar cámara y grabadora mediante timecode"],"correct":0,"why":"En Motion Capture, un actor con un traje de marcadores es capturado y sus movimientos se transfieren a un esqueleto y personaje digital."},{"ch":6,"q":"La composición digital (compositing) consiste en:","opts":["Combinar varias capas (imagen real, render 3D, humo, partículas, sombras...) en una única imagen final","Filmar la escena varias veces con distintas cámaras","Aplicar únicamente corrección de color primaria","Sincronizar el sonido con la imagen"],"correct":0,"why":"El compositing combina múltiples capas para obtener el plano final, y suele realizarse en Nuke, Fusion o After Effects."},{"ch":6,"q":"¿Qué software se menciona como el más utilizado para composición digital en el capítulo 6?","opts":["Nuke","Pro Tools","Avid Media Composer","DaVinci Fairlight"],"correct":0,"why":"El manual indica que Nuke es el software más utilizado para composición digital, junto con Fusion y After Effects."},{"ch":6,"q":"Cuando un plano VFX regresa terminado, entre las comprobaciones del editor se incluye:","opts":["Verificar la resolución, el espacio de color, el canal alfa y la sincronía","Aprobar directamente el máster de distribución","Generar el DCP final","Eliminar automáticamente las versiones anteriores"],"correct":0,"why":"El manual describe estos pasos de reintegración: verificar resolución, espacio de color, canal alfa, sustituir el plano temporal y comprobar la sincronía."},{"ch":6,"q":"¿Por qué es importante el control de versiones en los planos VFX (por ejemplo, SHOT_012_v001, v002...)?","opts":["Porque nunca se sustituyen archivos sin conservar las versiones anteriores, permitiendo volver atrás","Porque cada versión reduce automáticamente el peso del archivo","Porque el checksum cambia con cada versión","Porque el timecode debe reiniciarse en cada versión"],"correct":0,"why":"Mantener versiones anteriores permite volver atrás si aparece algún problema con la versión más reciente."},{"ch":6,"q":"Antes de enviar un plano a VFX, entre las buenas prácticas del capítulo 6 se recomienda comprobar que:","opts":["El montaje está bloqueado (Picture Lock) y se incluyen handles suficientes","El máster ya ha superado el QC final","El proyecto ya está archivado en LTO","La mezcla de sonido está finalizada en Atmos"],"correct":0,"why":"Entre las buenas prácticas se incluye comprobar que el montaje está en Picture Lock y que se incluyen handles suficientes, entre otros puntos."},{"ch":7,"q":"El objetivo principal del conformado (Online Editing) es:","opts":["Reconstruir exactamente el montaje aprobado sustituyendo los proxies por los archivos originales de cámara","Crear nuevos efectos visuales no previstos","Grabar nuevas tomas para sustituir las descartadas","Generar la mezcla final de sonido"],"correct":0,"why":"El conformado reconstruye el Picture Lock con los archivos originales, sin modificar ritmo, duraciones ni orden."},{"ch":7,"q":"Durante el conformado, ¿qué cambia respecto al montaje offline?","opts":["Únicamente la calidad del material, no el montaje en sí","El orden de las escenas","El ritmo narrativo de la película","Las duraciones de los planos"],"correct":0,"why":"El manual aclara que el montaje no cambia; lo único que cambia es la calidad del material (de proxy a original)."},{"ch":7,"q":"El proceso mediante el cual el software busca automáticamente el archivo original correspondiente a cada proxy se llama:","opts":["Relink","Transcode","Rendering","Matching"],"correct":0,"why":"El Relink es el paso más importante del conformado: el software localiza el original que corresponde a cada proxy."},{"ch":7,"q":"¿Qué puede provocar que el Relink falle según el capítulo 7?","opts":["Que se hayan modificado los nombres de los archivos originales durante la producción","Que el proyecto se haya guardado varias veces","Que se use más de un monitor de referencia","Que el framerate sea de 24 fps"],"correct":0,"why":"Si el nombre de los archivos cambia respecto al original, el relink puede fallar; por eso nunca deben modificarse los nombres."},{"ch":7,"q":"¿Qué formato de intercambio es descrito como el estándar de la industria para intercambiar proyectos complejos, usado entre Avid, Pro Tools y Resolve?","opts":["AAF (Advanced Authoring Format)","XML","EDL","MXF"],"correct":0,"why":"El AAF puede contener referencias a vídeo, audio, efectos y metadatos, y es el estándar para proyectos complejos entre Avid, Pro Tools y Resolve."},{"ch":7,"q":"¿Qué formato de intercambio es el más antiguo, contiene únicamente información esencial y no admite muchos efectos modernos?","opts":["EDL (Edit Decision List)","AAF","XML","IMF"],"correct":0,"why":"El EDL es el formato más antiguo, con información esencial (in/out de clips) y compatibilidad muy amplia pero limitada en efectos."},{"ch":7,"q":"El formato XML, muy utilizado entre Premiere, Final Cut y Resolve, se caracteriza porque:","opts":["Contiene duración, transiciones, velocidad y nombres, pero no el vídeo en sí","Contiene el vídeo comprimido en su interior","Es exclusivo de DaVinci Resolve","Sustituye completamente al AAF en todos los casos"],"correct":0,"why":"El XML contiene información de edición (duraciones, transiciones, nombres, posiciones) pero no contiene el vídeo."},{"ch":7,"q":"¿Qué elementos suelen conservarse al pasar del montaje offline al online, según el capítulo 7?","opts":["Cortes, fundidos y cambios de velocidad sencillos","Todos los plugins de terceros sin excepción","Los títulos definitivos automáticamente","El sonido definitivo mezclado"],"correct":0,"why":"El manual indica que se conservan cortes, fundidos y cambios de velocidad sencillos, mientras que títulos, grafismos y plugins pueden necesitar rehacerse."},{"ch":7,"q":"El Digital Intermediate (DI) incluye procesos como:","opts":["Conformado, corrección de color, integración de VFX y preparación para distribución","Únicamente la grabación de las tomas adicionales","Únicamente el diseño de sonido","Únicamente la generación de subtítulos"],"correct":0,"why":"El DI es el proceso de acabado definitivo que incluye conformado, color, VFX y preparación para distribución."},{"ch":7,"q":"Según la tabla de resoluciones del capítulo 7, ¿qué resolución corresponde al 'Cine 2K'?","opts":["2048 × 1080","1920 × 1080","3840 × 2160","8192 × 4320"],"correct":0,"why":"El manual asigna 2048×1080 al Cine 2K, mientras que 1920×1080 es televisión HD y 3840×2160 es UHD."},{"ch":7,"q":"¿Por qué puede convenir rodar en 6K u 8K aunque la entrega final sea en 4K?","opts":["Para poder reencuadrar, estabilizar y hacer zoom sin perder calidad","Porque reduce automáticamente el tamaño del archivo","Porque es obligatorio por ley en todas las producciones","Porque mejora automáticamente la sincronía de audio"],"correct":0,"why":"El manual explica que grabar en mayor resolución que la de entrega permite reencuadrar, estabilizar y hacer zoom sin pérdida de calidad."},{"ch":7,"q":"Durante el conformado, la profundidad de color habitual pasa de 8 bits (offline) a valores como:","opts":["10, 12 o 16 bits","4 u 8 bits únicamente","1 o 2 bits","24 o 48 bits"],"correct":0,"why":"El manual indica que durante el conformado es habitual usar 10, 12 o 16 bits para mayor margen de etalonaje y menos banding."},{"ch":7,"q":"¿Qué formato de aspecto (aspect ratio) se asocia en el capítulo 7 al 'cine panorámico'?","opts":["2.39:1","1.33:1","1.78:1 (16:9)","9:16"],"correct":0,"why":"La tabla del capítulo asigna 2.39:1 al cine panorámico, 1.78:1 a HD/UHD y 9:16 a redes sociales."},{"ch":7,"q":"¿Qué framerate se asocia habitualmente al 'Streaming' en la tabla del capítulo 7?","opts":["30 fps","23.976 fps","25 fps","50 fps"],"correct":0,"why":"La tabla asigna 30 fps al streaming, 23.976 al cine digital, 25 a Europa y 50 al broadcast."},{"ch":7,"q":"Antes de enviar el proyecto al colorista, en la preparación para el color (7.14) se eliminan elementos como:","opts":["LUT provisionales, gráficos de referencia y música temporal","Los archivos originales de cámara","El AAF de sonido","Las copias de seguridad del proyecto"],"correct":0,"why":"El manual indica que se eliminan elementos temporales (LUT provisionales, gráficos de referencia, música temporal, notas del editor) antes de entregar al colorista."},{"ch":7,"q":"El AAF generado en paralelo para el departamento de sonido (7.15) contiene:","opts":["Diálogos, música, efectos y automatizaciones básicas","Únicamente el vídeo final renderizado","Únicamente los créditos finales","Únicamente los metadatos de cámara"],"correct":0,"why":"El AAF de sonido incluye diálogos, música, efectos y automatizaciones básicas para continuar el trabajo en Pro Tools o Fairlight."},{"ch":7,"q":"Entre la lista de comprobación final del Online (7.16) se incluye verificar que:","opts":["Todos los proxies han sido sustituidos y no existen archivos Offline","El máster ya está distribuido en todas las plataformas","El chroma key ha sido eliminado del proyecto","El Foley ya se ha grabado por completo"],"correct":0,"why":"La lista de comprobación incluye comprobar que todos los proxies fueron sustituidos, no hay offline, el color coincide y la duración coincide con el Picture Lock."},{"ch":7,"q":"Según las buenas prácticas del capítulo 7, tras el Picture Lock se recomienda:","opts":["No modificar el montaje y mantener intactos los nombres de los archivos","Cambiar libremente el orden de las escenas si mejora el ritmo","Sustituir todos los originales por proxies definitivos","Eliminar las versiones anteriores del proyecto para ahorrar espacio"],"correct":0,"why":"El manual recomienda no modificar el montaje tras el Picture Lock y mantener intactos los nombres de archivo para no romper el relink."},{"ch":7,"q":"¿Qué consecuencia puede tener un error de un solo fotograma en esta fase, según el manual?","opts":["Puede obligar a repetir horas de trabajo en color, sonido y VFX","Ninguna, ya que se corrige automáticamente en el QC","Solo afecta a la duración total del máster","Solo afecta a los subtítulos"],"correct":0,"why":"El manual advierte que un error de un solo fotograma puede obligar a repetir horas de trabajo en color, sonido y efectos visuales."},{"ch":7,"q":"El conformado constituye, según la introducción del capítulo 7:","opts":["El puente entre el montaje narrativo y el acabado final del proyecto","El primer paso del rodaje","La fase final de distribución en streaming","El proceso de selección de tomas durante el offline"],"correct":0,"why":"El manual describe el conformado como el puente entre el montaje narrativo (offline) y el acabado final del proyecto."},{"ch":8,"q":"¿Cuál es la diferencia principal entre corrección de color y etalonaje según el capítulo 8?","opts":["La corrección de color iguala técnicamente los planos; el etalonaje crea un aspecto artístico","Son exactamente el mismo proceso sin ninguna diferencia","La corrección de color es un proceso creativo y el etalonaje técnico","El etalonaje se realiza siempre antes del conformado"],"correct":0,"why":"El manual distingue: corrección de color (técnica, iguala exposición y balance) y etalonaje/color grading (creativo, crea un look)."},{"ch":8,"q":"¿Cuál de estos objetivos corresponde a la corrección de color (Color Correction) y no al etalonaje?","opts":["Igualar la exposición y corregir dominantes de color entre planos","Crear un ambiente frío o cálido","Aplicar un aspecto vintage","Lograr una estética de cine negro"],"correct":0,"why":"Igualar exposición y corregir dominantes son ejemplos de corrección de color, un proceso técnico, no creativo."},{"ch":8,"q":"Según el flujo de trabajo del colorista (8.2), la corrección primaria se realiza:","opts":["Antes de la corrección secundaria y de los Power Windows","Después del Look final","Después del render para sonido y máster","Antes de la gestión del color"],"correct":0,"why":"El orden descrito es: conformado, comprobación, gestión del color, corrección primaria, corrección secundaria, Power Windows, tracking, look final, render."},{"ch":8,"q":"¿Qué característica NO se menciona entre las de los monitores de referencia profesionales (8.3)?","opts":["10 bits reales y cobertura DCI-P3","Ser un televisor doméstico convencional","Uniformidad de brillo","Calibración periódica"],"correct":1,"why":"El manual advierte preci   chapters: [],        // list of chapter numbers in current run
  chIndex: 0,           // index into state.chapters for current question set
  pool: [],             // shuffled question list for current run
  qIndex: 0,
  answered: false,
  selected: null,
  score: 0,
  perChapter: {},       // {chNum: {correct, total}}
  best: {}              // best % per chapter, loaded from storage
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function shuffleOptions(q){
  // returns {q, opts, correctIdx, why} with options shuffled, correct index remapped
  const idxs = shuffle([0,1,2,3]);
  const opts = idxs.map(i=>q.opts[i]);
  const correct = idxs.indexOf(q.correct);
  return {ch:q.ch, q:q.q, opts, correct, why:q.why};
}

async function loadBest(){
  try{
    const r = await window.storage.get('best-scores', false);
    if(r && r.value){ state.best = JSON.parse(r.value); }
  }catch(e){ state.best = {}; }
}
async function saveBest(){
  try{
    await window.storage.set('best-scores', JSON.stringify(state.best), false);
  }catch(e){ /* ignore */ }
}

function startRun(chapterNums){
  state.chapters = chapterNums;
  const raw = QUESTIONS.filter(q => chapterNums.includes(q.ch));
  state.pool = shuffle(raw).map(shuffleOptions);
  state.qIndex = 0;
  state.answered = false;
  state.selected = null;
  state.score = 0;
  state.perChapter = {};
  chapterNums.forEach(c => state.perChapter[c] = {correct:0,total:0});
  state.view = 'quiz';
  render();
}

function answer(idx){
  if(state.answered) return;
  state.answered = true;
  state.selected = idx;
  const cur = state.pool[state.qIndex];
  const isCorrect = idx === cur.correct;
  if(isCorrect) state.score++;
  state.perChapter[cur.ch].total++;
  if(isCorrect) state.perChapter[cur.ch].correct++;
  render();
}

async function nextQuestion(){
  if(state.qIndex < state.pool.length - 1){
    state.qIndex++;
    state.answered = false;
    state.selected = null;
    render();
  } else {
    // compute per-chapter % and store best
    state.chapters.forEach(c => {
      const pc = state.perChapter[c];
      const pct = pc.total ? Math.round((pc.correct/pc.total)*100) : 0;
      if(!state.best[c] || pct > state.best[c]) state.best[c] = pct;
    });
    await saveBest();
    state.view = 'results';
    render();
  }
}

function goHome(){
  state.view = 'home';
  render();
}

function letter(i){ return ['A','B','C','D'][i]; }

function renderHome(){
  const app = document.getElementById('app');
  const chNums = Object.keys(CH_TITLES).map(Number);
  let cards = chNums.map(n => {
    const best = state.best[n];
    const badge = best !== undefined
      ? `<span class="chdone">${best}%</span>`
      : `<span class="chdone" style="color:var(--muted)">—</span>`;
    return `
    <button class="chcard" data-single="${n}">
      <span class="chnum">${String(n).padStart(2,'0')}</span>
      <span class="chinfo">
        <span class="ttl">${CH_TITLES[n]}</span>
        <span class="meta">20 preguntas</span>
      </span>
      ${badge}
    </button>`;
  }).join('');

  app.innerHTML = `
    <div class="slate">
      <span class="slate-chip">TAKE 01</span>
      <span class="slate-line"></span>
      <span class="timecode">200 PREGUNTAS · 10 CAPÍTULOS</span>
    </div>
    <h1 class="title">Examen de<br><span>Montaje &amp; Postproducción</span></h1>
    <p class="subtitle">Repasa el manual profesional de montaje audiovisual, capítulo a capítulo. Elige un capítulo para practicar o encadénalos todos en una sesión completa.</p>

    <div class="scopes">
      <div class="scope-wheel" aria-hidden="true"></div>
      <div class="scope-label"><b>Lift · Gamma · Gain</b>Cada pregunta, como un plano, se corrige y se aprueba antes de pasar al siguiente.</div>
    </div>

    <div class="panel">
      <div class="hud" style="margin-bottom:0;">
        <div class="hud-left">Elige un <b>capítulo</b> para repasar</div>
      </div>
      <div class="chgrid">${cards}</div>
      <button class="startall" id="startAllBtn">Examen completo · los 10 capítulos (200 preguntas)</button>
    </div>
    <footer class="credit">MANUAL PROFESIONAL DE MONTAJE Y POSTPRODUCCIÓN AUDIOVISUAL</footer>
  `;

  app.querySelectorAll('[data-single]').forEach(btn => {
    btn.addEventListener('click', () => startRun([Number(btn.dataset.single)]));
  });
  document.getElementById('startAllBtn').addEventListener('click', () => {
    startRun(Object.keys(CH_TITLES).map(Number));
  });
}

function renderQuiz(){
  const app = document.getElementById('app');
  const cur = state.pool[state.qIndex];
  const total = state.pool.length;
  const pct = Math.round(((state.qIndex)/total)*100);
  const isMulti = state.chapters.length > 1;

  const optsHtml = cur.opts.map((opt,i) => {
    let cls = 'opt';
    if(state.answered){
      cls += ' locked';
      if(i === cur.correct) cls += ' correct';
      else if(i === state.selected) cls += ' wrong';
      else cls += ' dim';
    }
    return `<button class="${cls}" data-idx="${i}" ${state.answered?'disabled':''}>
      <span class="letter">${letter(i)}</span><span>${opt}</span>
    </button>`;
  }).join('');

  const isCorrect = state.answered && state.selected === cur.correct;
  const feedbackHtml = state.answered ? `
    <div class="feedback show ${isCorrect?'ok':'bad'}">
      <span class="tag">${isCorrect? '✓ CORRECTO' : '✗ INCORRECTO'}</span>
      ${cur.why}
    </div>
  ` : '';

  app.innerHTML = `
    <button class="backlink" id="backBtn">← Volver a capítulos</button>
    <div class="hud">
      <div class="hud-left">${isMulti? 'Examen completo' : 'Cap. '+cur.ch+' · '+CH_TITLES[cur.ch]} &nbsp; <b>${state.qIndex+1} / ${total}</b></div>
      <div class="scorepill">${state.score} ✓</div>
    </div>
    <div class="timeline"><div class="timeline-fill" style="width:${pct}%"></div></div>

    <div class="panel" style="margin-top:18px;">
      <div class="qeyebrow">Cap. ${cur.ch} · TC ${String(state.qIndex+1).padStart(3,'0')}</div>
      <div class="qtext">${cur.q}</div>
      <div class="opts">${optsHtml}</div>
      ${feedbackHtml}
      <div class="navrow">
        <button class="nextbtn ${state.answered?'show':''}" id="nextBtn">${state.qIndex < total-1 ? 'Siguiente pregunta →' : 'Ver resultados →'}</button>
      </div>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', goHome);
  if(!state.answered){
    app.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click', ()=> answer(Number(btn.dataset.idx)));
    });
  }
  const nb = document.getElementById('nextBtn');
  if(nb) nb.addEventListener('click', nextQuestion);
}

function renderResults(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  let msg = 'Sigue repasando.';
  if(pct >= 90) msg = 'Nivel de montador profesional.';
  else if(pct >= 75) msg = 'Muy buen dominio del temario.';
  else if(pct >= 50) msg = 'Vas por buen camino, repasa los fallos.';

  const rows = state.chapters.map(c=>{
    const pc = state.perChapter[c];
    const p = pc.total ? Math.round((pc.correct/pc.total)*100) : 0;
    return `<div class="brow">
      <span class="blabel">Cap. ${c}</span>
      <span class="btrack"><span class="bfill" style="width:${p}%"></span></span>
      <span class="bscore">${pc.correct}/${pc.total}</span>
    </div>`;
  }).join('');

  app.innerHTML = `
    <button class="backlink" id="backBtn">← Volver a capítulos</button>
    <div class="panel">
      <div class="qeyebrow">Resultado final</div>
      <div class="result-badge">${state.score} / ${total}</div>
      <div class="result-sub">${pct}% de aciertos · ${msg}</div>
      <div class="breakdown">${rows}</div>
      <div class="resultbtns">
        <button class="btn-primary" id="retryBtn">Repetir este examen</button>
        <button class="btn-secondary" id="homeBtn">Elegir otro capítulo</button>
      </div>
    </div>
    <footer class="credit">MANUAL PROFESIONAL DE MONTAJE Y POSTPRODUCCIÓN AUDIOVISUAL</footer>
  `;
  document.getElementById('backBtn').addEventListener('click', goHome);
  document.getElementById('homeBtn').addEventListener('click', goHome);
  document.getElementById('retryBtn').addEventListener('click', ()=> startRun(state.chapters));
}

function render(){
  if(state.view === 'home') renderHome();
  else if(state.view === 'quiz') renderQuiz();
  else renderResults();
}

(async function init(){
  await loadBest();
  render();
})();
</script>
</body>
</html>
